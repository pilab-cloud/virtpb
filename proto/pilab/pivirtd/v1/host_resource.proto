syntax = "proto3";

package pilab.pivirtd.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/pivirtd/v1;pivirtdv1";

import "google/protobuf/timestamp.proto";

// ==================== Host Event Types ====================

// HostEventType enumerates the types of host-level VM events.
enum HostEventType {
  HOST_EVENT_TYPE_UNSPECIFIED = 0;
  HOST_EVENT_TYPE_VM_CREATED = 1;
  HOST_EVENT_TYPE_VM_STARTED = 2;
  HOST_EVENT_TYPE_VM_STOPPED = 3;
  HOST_EVENT_TYPE_VM_PAUSED = 4;
  HOST_EVENT_TYPE_VM_CRASHED = 5;
  HOST_EVENT_TYPE_VM_RESUMED = 6;
  HOST_EVENT_TYPE_VM_DELETED = 7;
  HOST_EVENT_TYPE_VM_DISK_MOVE_STARTED = 8;
  HOST_EVENT_TYPE_VM_DISK_MOVE_COMPLETED = 9;
  HOST_EVENT_TYPE_VM_DISK_MOVE_FAILED = 10;
  HOST_EVENT_TYPE_VM_DISK_MOVE_CANCELLED = 11;
  HOST_EVENT_TYPE_VM_SNAPSHOT_STARTED = 12;
  HOST_EVENT_TYPE_VM_SNAPSHOT_COMPLETED = 13;
  HOST_EVENT_TYPE_VM_SNAPSHOT_FAILED = 14;
  HOST_EVENT_TYPE_VM_SNAPSHOT_CANCELLED = 15;
  HOST_EVENT_TYPE_HEARTBEAT = 20;
  HOST_EVENT_TYPE_HEALTH_DEGRADED = 21;
  HOST_EVENT_TYPE_HEALTH_FAILED = 22;
  HOST_EVENT_TYPE_RESOURCE_CPU_PRESSURE = 30;
  HOST_EVENT_TYPE_RESOURCE_MEM_PRESSURE = 31;
  HOST_EVENT_TYPE_RESOURCE_DISK_PRESSURE = 32;
  HOST_EVENT_TYPE_RESOURCE_REPORT = 40;
  HOST_EVENT_TYPE_VM_MIGRATION_STARTED = 50;
  HOST_EVENT_TYPE_VM_MIGRATION_PROGRESS = 51;
  HOST_EVENT_TYPE_VM_MIGRATION_COMPLETED = 52;
  HOST_EVENT_TYPE_VM_MIGRATION_FAILED = 53;
  HOST_EVENT_TYPE_VM_MIGRATION_CANCELLED = 54;
}

// ==================== Host Resource Report ====================

// HostResourceReport contains comprehensive host resource information.
message HostResourceReport {
  int32 physical_cpus = 1;
  int32 physical_cores = 2;
  int32 physical_threads = 3;
  string cpu_model = 4;
  int32 cpu_freq_mhz = 5;
  int64 memory_total_mb = 6;
  int64 memory_available_mb = 7;
  int64 memory_used_by_vms_mb = 8;
  int64 memory_reserved_mb = 16;  // Memory reserved for system/VMs
  repeated NUMANode numa_nodes = 9;
  bool kvm_available = 10;
  bool nested_virtualization = 11;
  bool vmx_svm_supported = 12;
  bool hugepages_available = 13;
  string qemu_version = 14;
  StorageSummary storage = 15;
  repeated string cpu_model_flags = 17;
  repeated StoragePoolSummary pools = 18;
  string migration_address = 19;
  int32 max_concurrent_migrations = 20;
  // agent_endpoint is the base URL the director reaches the agent's API at,
  // e.g. http://10.0.0.5:50061. The agent works it out from its own listen
  // address; the director never guesses it.
  string agent_endpoint = 21;

  // Physical hardware inventory. These are the devices the hypervisor
  // actually has, not the resources VMs request; they change only when the
  // host's hardware changes.
  repeated HostDisk disks = 22;
  repeated HostNetworkAdapter network_adapters = 23;
  repeated HostPCIDeviceInfo pci_devices = 24;
}

// HostDisk is one physical block device (not a partition).
message HostDisk {
  // name is the kernel name, e.g. "sda" or "nvme0n1".
  string name = 1;
  // path is the device node, e.g. "/dev/sda".
  string path = 2;
  string model = 3;
  string serial = 4;
  // wwn is the World Wide Name / unique device id when the kernel exposes one.
  string wwn = 5;
  string vendor = 6;
  int64 size_bytes = 7;
  // type is "hdd", "ssd" or "nvme".
  string type = 8;
  // bus is "sata", "sas", "nvme", "virtio", "usb" or "unknown".
  string bus = 9;
  bool rotational = 10;
  bool removable = 11;
  // pci_address is the parent controller's BDF when the disk sits behind PCI.
  string pci_address = 12;
}

// HostNetworkAdapter is one physical or virtual network interface on the host.
message HostNetworkAdapter {
  string name = 1;
  string mac_address = 2;
  string driver = 3;
  // pci_address is the parent controller's BDF, empty for virtual interfaces.
  string pci_address = 4;
  string vendor = 5;
  string model = 6;
  // speed_mbps is the negotiated link speed; 0 when unknown or down.
  int64 speed_mbps = 7;
  int32 mtu = 8;
  bool link_up = 9;
  bool virtual = 10;
  repeated string addresses = 11;
}

// HostPCIDeviceInfo is one device on the host's PCI bus.
message HostPCIDeviceInfo {
  // address is the BDF, e.g. "0000:01:00.0".
  string address = 1;
  string vendor_id = 2;
  string device_id = 3;
  // class_id is the PCI class code without the 0x prefix, e.g. "0200".
  string class_id = 4;
  string class_name = 5;
  string driver = 6;
  string subsystem_vendor_id = 7;
  string subsystem_device_id = 8;
  bool multifunction = 9;
  // network_interface names the netdev this device backs, when it is a NIC.
  string network_interface = 10;
}

// NUMANode represents a single NUMA node's configuration.
message NUMANode {
  int32 node_id = 1;
  int64 memory_total_bytes = 2;
  repeated int32 cpu_core_ids = 3;
}

// StorageSummary summarizes the host's storage pool capacities.
message StorageSummary {
  int64 pool_total_bytes = 1;
  int64 pool_available_bytes = 2;
  int64 pool_used_bytes = 3;
}

// StoragePoolSummary summarizes a single storage pool's capacity.
message StoragePoolSummary {
  string id = 1;
  string kind = 2;
  int64 total_bytes = 3;
  int64 available_bytes = 4;
  string name = 5;
  string mount_path = 6;
}

// ==================== Event Streaming ====================

// SubscribeEventsRequest is an empty request to subscribe to VM events.
message SubscribeEventsRequest {}

// HostEvent represents an event occurring on the host, with a typed payload.
message HostEvent {
  string id = 1;
  HostEventType type = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof payload {
    VmLifecycleEvent vm_lifecycle = 4;
    HostHealthEvent host_health = 5;
    ResourcePressureEvent resource_pressure = 6;
    HostResourceReport resource_report = 7;
    VmDiskMoveEvent vm_disk_move = 8;
    VmSnapshotEvent vm_snapshot = 9;
    VmMigrationEvent vm_migration = 10;
  }
}

// VmLifecycleEvent contains details about a VM state transition.
message VmLifecycleEvent {
  string vm_name = 1;
  string vm_uuid = 2;
  string previous_state = 3;
  string new_state = 4;
}

// HostHealthEvent reports a host health check result.
message HostHealthEvent {
  string check_name = 1;
  string status = 2;
  string message = 3;
}

// ResourcePressureEvent reports system resource pressure (CPU, memory, disk).
message ResourcePressureEvent {
  string resource_type = 1;
  double threshold_percent = 2;
  double current_percent = 3;
  string details = 4;
}

message VmDiskMoveEvent {
  string vm_name = 1;
  string vm_uuid = 2;
  string device = 3;
  string target = 4;
  string status = 5;
  string message = 6;
}

message VmSnapshotEvent {
  string vm_name = 1;
  string vm_uuid = 2;
  string snapshot_name = 3;
  string operation = 4;
  string status = 5;
  string message = 6;
}

message VmMigrationEvent {
  string vm_name = 1;
  string vm_uuid = 2;
  string direction = 3;  // "out" | "in"
  string peer = 4;
  int64 transferred_bytes = 5;
  int64 remaining_bytes = 6;
  int64 expected_downtime_ms = 7;
  string status = 8;
  string message = 9;
}
