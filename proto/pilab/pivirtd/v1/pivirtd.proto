syntax = "proto3";

package pilab.pivirtd.v1;

option go_package = "go.pilab.hu/cloud/virtpb/pilab/pivirtd/v1;pivirtdv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "pilab/common/v1/vm.proto";
import "pilab/pivirtd/v1/host_resource.proto";

// Main Pivirtd Service - Replacement for libvirtd
service PivirtdService {
  // VM Lifecycle Management
  rpc CreateVM(CreateVMRequest) returns (VMResponse);
  rpc ApplyVM(ApplyVMRequest) returns (VMResponse) {
    option deprecated = true;
  }
  rpc StartVM(StartVMRequest) returns (VMResponse);
  rpc StopVM(StopVMRequest) returns (VMResponse);
  rpc PauseVM(PauseVMRequest) returns (VMResponse);
  rpc ResumeVM(ResumeVMRequest) returns (VMResponse);
  rpc RebootVM(RebootVMRequest) returns (VMResponse);
  rpc DeleteVM(DeleteVMRequest) returns (DeleteVMResponse);
  
  // VM Queries
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);
  rpc GetVM(GetVMRequest) returns (VMResponse);
  rpc GetVMStats(GetVMStatsRequest) returns (VMStatsResponse);
  rpc UpdateVMMemory(UpdateVMMemoryRequest) returns (VMResponse);
  rpc UpdateVMCpu(UpdateVMCpuRequest) returns (VMResponse);
  
  // QMP Passthrough
  rpc ExecuteQMP(ExecuteQMPRequest) returns (ExecuteQMPResponse);
  rpc StreamQMPEvents(StreamQMPRequest) returns (stream QMPEvent);
  
  // Snapshot Management
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (SnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc ConsolidateSnapshot(ConsolidateSnapshotRequest) returns (SnapshotResponse);
  rpc GetSnapshotStatus(GetSnapshotStatusRequest) returns (SnapshotStatusResponse);
  
  // Clone Operations
  rpc CloneVM(CloneVMRequest) returns (VMResponse);
  rpc CloneSnapshot(CloneSnapshotRequest) returns (VMResponse);
  
  // Migration
  rpc MigrateVM(MigrateVMRequest) returns (MigrateVMResponse);
  rpc GetMigrationStatus(GetMigrationStatusRequest) returns (MigrationStatusResponse);
  
  // Storage Management
  rpc CreateStoragePool(CreateStoragePoolRequest) returns (StoragePoolResponse);
  rpc ListStoragePools(ListStoragePoolsRequest) returns (ListStoragePoolsResponse);
  rpc DeleteStoragePool(DeleteStoragePoolRequest) returns (DeleteStoragePoolResponse);
  rpc GetStoragePool(GetStoragePoolRequest) returns (StoragePoolResponse);
  rpc ActivateStoragePool(ActivateStoragePoolRequest) returns (StoragePoolResponse);
  rpc DeactivateStoragePool(DeactivateStoragePoolRequest) returns (StoragePoolResponse);
  
  // Network Management
  rpc CreateTAPDevice(CreateTAPDeviceRequest) returns (NetworkResponse);
  rpc DeleteTAPDevice(DeleteTAPDeviceRequest) returns (DeleteNetworkResponse);
  rpc ListTAPDevices(ListTAPDevicesRequest) returns (ListTAPDevicesResponse);
  rpc CreateBridge(CreateBridgeRequest) returns (NetworkResponse);
  rpc DeleteBridge(DeleteBridgeRequest) returns (DeleteNetworkResponse);
  rpc ListBridges(ListBridgesRequest) returns (ListBridgesResponse);

  // OVS Networking
  rpc CreateOVSBridge(CreateOVSBridgeRequest) returns (NetworkResponse);
  rpc DeleteOVSBridge(DeleteOVSBridgeRequest) returns (DeleteNetworkResponse);
  rpc ListOVSBridges(ListOVSBridgesRequest) returns (ListOVSBridgesResponse);
  rpc AddOVSPort(AddOVSPortRequest) returns (NetworkResponse);
  rpc RemoveOVSPort(RemoveOVSPortRequest) returns (DeleteNetworkResponse);
  rpc ListOVSPorts(ListOVSPortsRequest) returns (ListOVSPortsResponse);

  // Host Networks (isolated / NAT / routed / bridged bridges)
  rpc ApplyNetwork(ApplyNetworkRequest) returns (NetworkStatusResponse);
  rpc DeleteNetwork(DeleteNetworkRequest2) returns (DeleteNetworkResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc GetNetwork(GetNetworkRequest) returns (NetworkStatusResponse);

  // OVS Overlay Networks
  rpc ApplyOverlayNetwork(ApplyOverlayNetworkRequest) returns (OverlayNetworkResponse);
  rpc DeleteOverlayNetwork(DeleteOverlayNetworkRequest) returns (DeleteNetworkResponse);
  rpc ListOverlayNetworks(ListOverlayNetworksRequest) returns (ListOverlayNetworksResponse);

  // External IP Bindings
  rpc BindExternalIP(BindExternalIPRequest) returns (ExternalIPResponse);
  rpc UnbindExternalIP(UnbindExternalIPRequest) returns (DeleteNetworkResponse);
  rpc ListExternalIPs(ListExternalIPsRequest) returns (ListExternalIPsResponse);

  // Network Namespaces
  rpc ListNetworkNamespaces(ListNetworkNamespacesRequest) returns (ListNetworkNamespacesResponse);

  // VM Metadata Labels
  rpc SetLabels(SetLabelsRequest) returns (SetLabelsResponse);
  rpc GetLabels(GetLabelsRequest) returns (GetLabelsResponse);
  rpc DeleteLabel(DeleteLabelRequest) returns (DeleteLabelResponse);

  // VM Provisioning
  rpc SetProvisioning(SetProvisioningRequest) returns (SetProvisioningResponse);

  // VM Status
  rpc GetVMStatus(GetVMStatusRequest) returns (GetVMStatusResponse);

  // Disk Move (live block job mirroring)
  rpc StartDiskMove(StartDiskMoveRequest) returns (DiskMoveStatusResponse);
  rpc GetDiskMoveStatus(GetDiskMoveStatusRequest) returns (DiskMoveStatusResponse);
  rpc CancelDiskMove(CancelDiskMoveRequest) returns (DiskMoveResponse);

  // VM Device Hot-plug
  rpc AttachDisk(AttachDiskRequest) returns (VMResponse);
  rpc DetachDisk(DetachDiskRequest) returns (VMResponse);
  rpc AttachNIC(AttachNICRequest) returns (VMResponse);
  rpc DetachNIC(DetachNICRequest) returns (VMResponse);

  // Live Reconfiguration
  rpc ResizeDisk(ResizeDiskRequest) returns (VMResponse);
  rpc SetVNCPassword(SetVNCPasswordRequest) returns (VMResponse);
  rpc SetLinkState(SetLinkStateRequest) returns (VMResponse);
  rpc RenameVM(RenameVMRequest) returns (VMResponse);
  rpc ChangeISO(ChangeISORequest) returns (VMResponse);
  rpc EjectISO(EjectISORequest) returns (VMResponse);

  // Snapshot Tree
  rpc GetSnapshotTree(GetSnapshotTreeRequest) returns (GetSnapshotTreeResponse);

  // Guest Agent
  rpc GetGuestInfo(GetGuestInfoRequest) returns (GetGuestInfoResponse);
  rpc GuestExec(GuestExecRequest) returns (GuestExecResponse);
  rpc GetGuestExecStatus(GetGuestExecStatusRequest) returns (GetGuestExecStatusResponse);
  rpc SetGuestHostname(SetGuestHostnameRequest) returns (SetGuestHostnameResponse);
  rpc CustomizeOS(CustomizeOSRequest) returns (CustomizeOSResponse);

  // Event Streaming
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream HostEvent);
  rpc GetHostResource(SubscribeEventsRequest) returns (HostResourceReport);
}

// ==================== VM Messages ====================

message CreateVMRequest {
  string name = 1;
  int32 memory_mb = 2;
  int32 vcpus = 3;
  string machine = 4;  // e.g., "q35", "pc", "virt"
  CPUConfig cpu = 5;
  repeated DiskConfig disks = 6;
  repeated NetworkConfig networks = 7;
  GraphicsConfig graphics = 8;
  bool autostart = 9;
  string cloud_image = 10;  // Path to disk image to use
  string disk_path = 11;    // Target path in VM folder
  string user_data = 12;     // Cloud-init user-data (YAML/cloud-config)
  string meta_data = 13;     // Cloud-init meta-data
  string ssh_key = 14;      // SSH public key for cloud-init
  string firmware = 15;      // "bios" | "uefi" (default: "uefi")
  EFIConfig efi = 16;        // UEFI configuration
  int32 max_memory_mb = 17;
  int32 memory_slots = 18;
  int32 max_vcpus = 19;
  ResourceSpec resources = 20;
}

message ApplyVMRequest {
  string yaml_manifest = 1;
}

message StartVMRequest {
  string name = 1;
}

message StopVMRequest {
  string name = 1;
  bool force = 2;  // true = SIGKILL, false = ACPI shutdown
}

message PauseVMRequest {
  string name = 1;
}

message ResumeVMRequest {
  string name = 1;
}

message RebootVMRequest {
  string name = 1;
  bool force = 2;  // true = reset, false = ACPI reboot
}

message DeleteVMRequest {
  string name = 1;
  bool force = 2;  // stop if running
}

message UpdateVMMemoryRequest {
  string name = 1;
  int32 target_memory_mb = 2;
}

message UpdateVMCpuRequest {
  string name = 1;
  int32 target_vcpu_count = 2;
}

message GetVMRequest {
  string name = 1;
}

message ListVMsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message VMResponse {
  VMInfo vm = 1;
  string error = 2;
}

message DeleteVMResponse {
  bool success = 1;
  string error = 2;
}

message ListVMsResponse {
  repeated VMInfo vms = 1;
  string next_page_token = 2;
}

message VMInfo {
  string name = 1;
  string uuid = 2;
  string state = 3;  // stopped, running, paused, shutting_down, crashed
  int32 memory_mb = 4;
  int32 vcpus = 5;
  string machine = 6;
  CPUConfig cpu = 7;
  repeated DiskConfig disks = 8;
  repeated NetworkConfig networks = 9;
  string folder = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string firmware = 13;
  EFIConfig efi = 14;
  int32 max_memory_mb = 15;
  int32 memory_slots = 16;
  int32 max_vcpus = 17;
  bytes yaml_spec = 18;  // Raw hades.VirtualMachine YAML specification
  map<string, string> labels = 19;  // VM metadata labels (key=value pairs)
}

message CPUConfig {
  string model = 1;  // e.g., "host", "qemu64"
  string topology = 2;  // e.g., "sockets=1,cores=2,threads=1"
  bool nested_virtualization = 3;
}

message DiskConfig {
  string id = 1;
  string path = 2;  // relative to VM folder or absolute
  string format = 3;  // qcow2, raw, qed
  int32 size_gb = 4;
  string bus = 5;  // virtio, ide, scsi
  bool readonly = 6;
  bool cache = 7;
}

message NetworkConfig {
  string id = 1;
  string type = 2;  // tap, user, bridge
  string tap_name = 3;
  string bridge_name = 4;
  string model = 5;  // virtio, e1000, rtl8139
  string mac_address = 6;
  bool link_up = 7;
}

message GraphicsConfig {
  string type = 1;  // vnc, spice, none
  int32 port = 2;
  string listen = 3;  // "127.0.0.1", "0.0.0.0"
  bool password_protected = 4;
}

// ==================== Stats Messages ====================

message GetVMStatsRequest {
  string name = 1;
}

message VMStatsResponse {
  string name = 1;
  CPUStats cpu_stats = 2;
  MemoryStats memory_stats = 3;
  repeated DiskStats disk_stats = 4;
  repeated NetworkStats network_stats = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message CPUStats {
  double usage_percent = 1;
  int32 online_vcpus = 2;
  int32 total_vcpus = 3;
}

message MemoryStats {
  int64 total_mb = 1;
  int64 used_mb = 2;
  int64 balloon_current_mb = 3;
  int64 balloon_max_mb = 4;
}

message DiskStats {
  string device = 1;
  int64 read_bytes = 2;
  int64 write_bytes = 3;
  int64 read_ops = 4;
  int64 write_ops = 5;
  // read_iops / write_iops are deltas over the sampling window since the
  // previous GetVMStats call for the same VM (0 on the first call).
  int64 read_iops = 6;
  int64 write_iops = 7;
  // read_latency_ms / write_latency_ms are cumulative average service time
  // per operation in milliseconds (0 when no operation completed).
  double read_latency_ms = 8;
  double write_latency_ms = 9;
}

message NetworkStats {
  string interface = 1;
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
  int64 rx_packets = 4;
  int64 tx_packets = 5;
}

// ==================== QMP Messages ====================

message ExecuteQMPRequest {
  string vm_name = 1;
  string command = 2;  // e.g., "query-status", "migrate"
  string arguments_json = 3;  // JSON string of arguments
}

message ExecuteQMPResponse {
  string result_json = 1;  // JSON string of result
  string error = 2;
}

message StreamQMPRequest {
  string vm_name = 1;
  repeated string event_types = 2;  // empty = all events
}

message QMPEvent {
  string event = 1;  // e.g., "SHUTDOWN", "RESET", "VNC_CONNECTED"
  string data_json = 2;  // JSON string of event data
  google.protobuf.Timestamp timestamp = 3;
}

// ==================== Snapshot Messages ====================

message CreateSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
  string description = 3;
  bool include_memory = 4;
  int32 retain_count = 5;
  google.protobuf.Duration retain_for = 6;
}

message ListSnapshotsRequest {
  string vm_name = 1;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message RestoreSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message DeleteSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message SnapshotResponse {
  SnapshotInfo snapshot = 1;
  string error = 2;
}

message DeleteSnapshotResponse {
  bool success = 1;
  string error = 2;
}

message ConsolidateSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message GetSnapshotStatusRequest {
  string vm_name = 1;
}

message SnapshotStatusResponse {
  VMJobStatus job = 1;
}

message SnapshotInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 vm_state_size = 4;
  google.protobuf.Timestamp date = 5;
  string parent_snapshot_id = 6;
  bool memory_snapshot = 7;
  int64 memory_size_bytes = 8;
  pilab.common.v1.SnapshotState state = 9;
}

message CloneVMRequest {
  string vm_name = 1;
  string new_vm_name = 2;
  bool start_after_clone = 3;
}

message CloneSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
  string new_vm_name = 3;
}

// ==================== Disk Move Messages ====================

message StartDiskMoveRequest {
  string vm_name = 1;
  string device = 2;
  string target = 3;
  string format = 4;
  string sync = 5;
  int64 speed = 6;
  int64 granularity = 7;
  int64 buf_size = 8;
  string on_source_error = 9;
  string on_target_error = 10;
  bool unmap = 11;
  string bitmap = 12;
  bool compression = 13;
}

message GetDiskMoveStatusRequest {
  string vm_name = 1;
}

message CancelDiskMoveRequest {
  string vm_name = 1;
}

message DiskMoveResponse {
  bool success = 1;
  string error = 2;
  VMJobStatus job = 3;
}

message DiskMoveStatusResponse {
  VMJobStatus job = 1;
}

message VMJobStatus {
  string type = 1;
  string device = 2;
  string status = 3;
  int64 transferred_bytes = 4;
  int64 total_bytes = 5;
  double progress_percent = 6;
  double speed_bytes_per_sec = 7;
  int64 eta_seconds = 8;
  string target = 9;
  string error = 10;
  google.protobuf.Timestamp started_at = 11;
}

// ==================== Migration Messages ====================

message MigrateVMRequest {
  string vm_name = 1;
  string destination_uri = 2;  // e.g., "tcp:192.168.1.100:4444"
  bool incremental = 3;
  bool compress = 4;
}

message MigrateVMResponse {
  bool success = 1;
  string error = 2;
}

message GetMigrationStatusRequest {
  string vm_name = 1;
}

message MigrationStatusResponse {
  string status = 1;  // "none", "active", "completed", "failed", "cancelled"
  int64 total_time_ms = 2;
  int64 downtime_ms = 3;
  int64 expected_downtime_ms = 4;
  double transferred_bytes = 5;
  double remaining_bytes = 6;
}

// ==================== Storage Messages ====================

message CreateStoragePoolRequest {
  string name = 1;
  string type = 2;  // "dir", "iscsi", "lvm"
  string path = 3;  // path to pool
  map<string, string> options = 4;
}

message StoragePoolResponse {
  StoragePool pool = 1;
  string error = 2;
}

message ListStoragePoolsRequest {}

message ListStoragePoolsResponse {
  repeated StoragePool pools = 1;
}

message DeleteStoragePoolRequest {
  string name = 1;
  bool force = 2;
}

message DeleteStoragePoolResponse {
  bool success = 1;
  string error = 2;
}

message StoragePool {
  string name = 1;
  string type = 2;  // "dir", "nfs", "iscsi"
  string path = 3;
  int64 capacity_bytes = 4;
  int64 allocated_bytes = 5;
  int64 available_bytes = 6;
  // active reports what the backend observes right now, not the stored
  // intent: an NFS pool whose server is gone reports false even though its
  // definition still says it should be up.
  bool active = 7;
  // options carries the backend-specific settings the pool was created with.
  // Secrets (CHAP passwords) are redacted.
  map<string, string> options = 8;
  // source is the backing source: a directory, "host:/export", or
  // "iqn...@portal".
  string source = 9;
  // device is the block device backing the pool, for iSCSI pools.
  string device = 10;
  // phase is "Active", "Inactive" or "Unavailable".
  string phase = 11;
  // message explains a pool that is not available, or carries a non-fatal
  // note about one that is.
  string message = 12;
  // desired_active is the stored intent, which differs from active when a
  // pool failed to come up or went away underneath the daemon.
  bool desired_active = 13;
}

message GetStoragePoolRequest {
  string name = 1;
}

message ActivateStoragePoolRequest {
  string name = 1;
}

message DeactivateStoragePoolRequest {
  string name = 1;
  // force allows a lazy unmount when the pool is busy, which is the only
  // unmount that works against an unreachable NFS server.
  bool force = 2;
}

// ==================== Network Messages ====================

message CreateTAPDeviceRequest {
  string name = 1;
  string bridge = 2;  // bridge to attach to
  bool persistent = 3;
  string owner = 4;
  string group = 5;
  bool use_ovs = 6;           // attach to OVS bridge
  string ovs_bridge = 7;         // OVS bridge name
  int32 vlan_tag = 8;            // VLAN tag
  bool tag_trunk = 9;            // trunk mode
}

message CreateBridgeRequest {
  string name = 1;
  repeated string interfaces = 2;  // physical interfaces to bridge
  string ip_address = 3;
  string netmask = 4;
  bool open_vswitch = 5;           // use OVS instead of Linux bridge
  int32 vlan_tag = 6;            // VLAN tag for access port
  repeated int32 trunks = 7;         // VLAN trunk ranges
  string ovs_bridge = 8;          // parent OVS bridge (e.g., br-int)
}

message NetworkResponse {
  NetworkDevice device = 1;
  string error = 2;
}

message ListTAPDevicesRequest {}

message ListTAPDevicesResponse {
  repeated TAPDevice taps = 1;
}

message ListBridgesRequest {}

message ListBridgesResponse {
  repeated Bridge bridges = 1;
}

message DeleteTAPDeviceRequest {
  string name = 1;
}

message DeleteBridgeRequest {
  string name = 1;
}

message DeleteNetworkResponse {
  bool success = 1;
  string error = 2;
}

message TAPDevice {
  string name = 1;
  string bridge = 2;
  string mac_address = 3;
  bool persistent = 4;
  bool active = 5;
}

message Bridge {
  string name = 1;
  repeated string interfaces = 2;
  string ip_address = 3;
  string netmask = 4;
  bool active = 5;
}

message NetworkDevice {
  oneof device {
    TAPDevice tap = 1;
    Bridge bridge = 2;
    OVSBridge ovs_bridge = 3;
    OVSPort ovs_port = 4;
  }
}

// ==================== OVS Messages ====================

message CreateOVSBridgeRequest {
  string name = 1;
  string parent = 2;           // parent OVS bridge (e.g., br-int)
  bool internal = 3;          // create internal port
}

message DeleteOVSBridgeRequest {
  string name = 1;
}

message ListOVSBridgesRequest {}

message ListOVSBridgesResponse {
  repeated OVSBridge bridges = 1;
}

message AddOVSPortRequest {
  string bridge = 1;            // OVS bridge name
  string port = 2;              // port/TAP device name
  int32 vlan_tag = 3;          // VLAN tag for access port
  repeated int32 trunks = 4;       // VLAN trunk ranges
}

message RemoveOVSPortRequest {
  string bridge = 1;
  string port = 2;
}

message ListOVSPortsRequest {
  string bridge = 1;
}

message ListOVSPortsResponse {
  repeated OVSPort ports = 1;
}

message OVSBridge {
  string name = 1;
  string parent = 2;           // parent bridge
  bool internal = 3;          // has internal port
}

message OVSPort {
  string name = 1;
  string bridge = 2;
  int32 vlan_tag = 3;
  repeated int32 trunks = 4;
}

// ==================== UEFI Messages ====================

message EFIConfig {
  string loader_path = 1;      // Path to OVMF_CODE.fd (UEFI firmware)
  string nvram_path = 2;       // Path to per-VM NVRAM file
  string nvram_template = 3;    // Path to OVMF_VARS.fd template
  bool secure_boot = 4;        // Enable secure boot (future)
}

// ==================== Label Messages ====================

message SetLabelsRequest {
  string vm_name = 1;
  map<string, string> labels = 2;
}

message SetLabelsResponse {
  bool success = 1;
  string error = 2;
}

message GetLabelsRequest {
  string vm_name = 1;
}

message GetLabelsResponse {
  map<string, string> labels = 1;
}

message DeleteLabelRequest {
  string vm_name = 1;
  string key = 2;
}

message DeleteLabelResponse {
  bool success = 1;
}

// ==================== Provisioning Messages ====================

message SetProvisioningRequest {
  string vm_name = 1;
  bool is_provisioning = 2;
}

message SetProvisioningResponse {
  bool success = 1;
  string error = 2;
}

// ==================== Status Messages ====================

message GetVMStatusRequest {
  string vm_name = 1;
}

message GetVMStatusResponse {
  string phase = 1;
  repeated VMCondition conditions = 2;
  repeated VMEvent events = 3;
  bool working = 4;
  string blocker_task = 5;
  repeated VMJobStatus jobs = 6;
}

message VMCondition {
  string type = 1;
  string status = 2;
  string reason = 3;
  string message = 4;
}

message VMEvent {
  string type = 1;
  string reason = 2;
  string message = 3;
}

// ==================== Resource Spec ====================

message ResourceSpec {
  int64 memory_limit_bytes = 1;
  int64 memory_reservation_bytes = 2;
  int64 cpu_shares = 3;
}

// ==================== Device Hot-plug Messages ====================

message AttachDiskRequest {
  string vm_name = 1;
  DiskConfig disk = 2;
}

message DetachDiskRequest {
  string vm_name = 1;
  string disk_id = 2;
}

message AttachNICRequest {
  string vm_name = 1;
  NetworkConfig nic = 2;
}

message DetachNICRequest {
  string vm_name = 1;
  string nic_id = 2;
}

// ==================== Live Reconfiguration Messages ====================

message ResizeDiskRequest {
  string vm_name = 1;
  string disk_id = 2;
  int64 new_size_gb = 3;
}

message SetVNCPasswordRequest {
  string vm_name = 1;
  string password = 2;
  int32 expire_seconds = 3;
}

message SetLinkStateRequest {
  string vm_name = 1;
  string nic_id = 2;
  bool link_up = 3;
}

message RenameVMRequest {
  string vm_name = 1;
  string new_name = 2;
}

message ChangeISORequest {
  string vm_name = 1;
  string disk_id = 2;
  string iso_path = 3;
}

message EjectISORequest {
  string vm_name = 1;
  string disk_id = 2;
}

// ==================== Snapshot Tree Messages ====================

message GetSnapshotTreeRequest {
  string vm_name = 1;
}

message GetSnapshotTreeResponse {
  repeated SnapshotNode roots = 1;
}

message SnapshotNode {
  SnapshotInfo snapshot = 1;
  repeated SnapshotNode children = 2;
}

// ==================== Guest Agent Messages ====================

message GetGuestInfoRequest {
  string vm_name = 1;
}

message GetGuestInfoResponse {
  string hostname = 1;
  string os_id = 2;
  string os_name = 3;
  string os_version = 4;
  string kernel_version = 5;
  repeated GuestNetworkInterface interfaces = 6;
  string error = 7;
}

message GuestNetworkInterface {
  string name = 1;
  string mac_address = 2;
  repeated string ip_addresses = 3;
}

message GuestExecRequest {
  string vm_id = 1;
  string path = 2;  // path to the executable inside the guest
  repeated string args = 3;
  repeated string env = 4;  // "KEY=VALUE" entries
  bytes input_data = 5;
  bool capture_output = 6;
}

message GuestExecResponse {
  string pid = 1;  // QEMU guest agent returns the pid as a string
}

message GetGuestExecStatusRequest {
  string vm_id = 1;
  string pid = 2;
}

message GetGuestExecStatusResponse {
  bool exited = 1;
  int64 exit_code = 2;
  bytes out_data = 3;
  bytes err_data = 4;
  bool out_truncated = 5;
  bool err_truncated = 6;
}

message SetGuestHostnameRequest {
  string vm_id = 1;
  string hostname = 2;
}

message SetGuestHostnameResponse {
  bool ok = 1;
}

message CustomizeOSRequest {
  string vm_id = 1;
  optional string hostname = 2;
  repeated string ssh_keys = 3;  // public key lines appended to the guest's authorized_keys
  repeated UserSpec users = 4;  // usernames only — no passwords
}

message UserSpec {
  string username = 1;
}

message CustomizeOSResponse {
  bool ok = 1;
  string message = 2;
}

// ==================== Host Network Messages ====================

// NetworkSpec describes a bridge-backed network on one host.
message NetworkSpec {
  string name = 1;
  // mode is "isolated", "nat", "routed" or "bridged".
  string mode = 2;
  // bridge is the Linux bridge name. Empty derives one from the name.
  string bridge = 3;
  // subnet is the network CIDR. Required in nat and routed mode.
  string subnet = 4;
  // gateway is the VMs' default route. Empty takes the first usable address.
  string gateway = 5;
  // uplink is the host interface outbound traffic leaves by.
  string uplink = 6;
  // physical_ports are enslaved to the bridge in bridged mode.
  repeated string physical_ports = 7;
  // vlan_filtering enables 802.1Q filtering on the bridge.
  bool vlan_filtering = 8;
  int32 mtu = 9;
}

// NetworkStatus is a host network's observed state.
message NetworkStatus {
  NetworkSpec spec = 1;
  string bridge = 2;
  // phase is "Active" or "Down".
  string phase = 3;
  // namespace is the router namespace, in routed mode.
  string namespace = 4;
  // transfer_net is the point-to-point link to that namespace.
  string transfer_net = 5;
  // ports are the interfaces currently on the bridge.
  repeated string ports = 6;
}

message ApplyNetworkRequest {
  NetworkSpec spec = 1;
}

message NetworkStatusResponse {
  NetworkStatus status = 1;
  // warnings are non-blocking notes about the applied spec.
  repeated string warnings = 2;
}

message DeleteNetworkRequest2 {
  string name = 1;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkStatus networks = 1;
}

message GetNetworkRequest {
  string name = 1;
}

// ==================== Overlay Network Messages ====================

// OverlayNetworkSpec describes one OVS-based overlay segment.
message OverlayNetworkSpec {
  string name = 1;
  // vni is the segment id on the wire, 1-16777215.
  uint32 vni = 2;
  // bridge is the OVS integration bridge. Empty defaults to "br-int".
  string bridge = 3;
  // tunnel_type is "vxlan", "geneve" or "gre". Empty defaults to vxlan.
  string tunnel_type = 4;
  // local_ip is this node's underlay address.
  string local_ip = 5;
  // peers are the other nodes' underlay addresses.
  repeated string peers = 6;
  // dst_port overrides the tunnel destination UDP port.
  int32 dst_port = 7;
  // mtu is requested on the VM-facing ports. Encapsulation costs 50 bytes for
  // VXLAN and 58 for Geneve on IPv4.
  int32 mtu = 8;
}

// OverlayNetworkStatus is an overlay network's observed state.
message OverlayNetworkStatus {
  OverlayNetworkSpec spec = 1;
  // local_vlan is the bridge-local VLAN the network is mapped to.
  int32 local_vlan = 2;
  // tunnel_ports are the tunnel ports currently serving the network.
  repeated string tunnel_ports = 3;
  // peers are the underlay addresses currently wired up.
  repeated string peers = 4;
  // local_ports are the VM ports attached on this host.
  repeated string local_ports = 5;
  string phase = 6;
}

message ApplyOverlayNetworkRequest {
  OverlayNetworkSpec spec = 1;
}

message OverlayNetworkResponse {
  OverlayNetworkStatus status = 1;
  repeated string warnings = 2;
}

message DeleteOverlayNetworkRequest {
  string name = 1;
}

message ListOverlayNetworksRequest {}

message ListOverlayNetworksResponse {
  repeated OverlayNetworkStatus networks = 1;
}

// ==================== External IP Messages ====================

// PortForward maps one external port onto a port on the VM.
message PortForward {
  // protocol is "tcp" or "udp".
  string protocol = 1;
  int32 external_port = 2;
  // internal_port defaults to external_port when zero.
  int32 internal_port = 3;
}

// ExternalIPSpec binds a routable address on this host to a VM.
message ExternalIPSpec {
  string name = 1;
  // address is the external address, without a prefix.
  string address = 2;
  // prefix_len is the prefix it is configured with. Zero means a host route.
  int32 prefix_len = 3;
  // interface is the host interface to bind it on.
  string interface = 4;
  // internal_ip is the VM address traffic is translated to.
  string internal_ip = 5;
  // namespace binds the address inside a router namespace instead of the host.
  string namespace = 6;
  // port_forwards restricts the mapping to those ports. Empty is one-to-one.
  repeated PortForward port_forwards = 7;
}

message BindExternalIPRequest {
  ExternalIPSpec spec = 1;
}

message ExternalIPResponse {
  ExternalIPSpec spec = 1;
  // mapping is "one-to-one" or "port-forward".
  string mapping = 2;
}

message UnbindExternalIPRequest {
  string name = 1;
}

message ListExternalIPsRequest {}

message ListExternalIPsResponse {
  repeated ExternalIPSpec bindings = 1;
}

// ==================== Network Namespace Messages ====================

message ListNetworkNamespacesRequest {}

message ListNetworkNamespacesResponse {
  repeated string namespaces = 1;
}
