// HostAdminService is the operator-facing view of the hypervisor hosts the
// director manages: inventory, maintenance mode, and applying host objects
// (networks, bridges, storage pools) to a host through its agent.

syntax = "proto3";

package pilab.director.v2;

import "google/protobuf/timestamp.proto";
import "pilab/core/v1/storage_provisioning_service.proto";
import "pilab/director/v2/node_service.proto";
import "pilab/director/v2/task_service.proto";
import "pilab/pivirtd/v1/host_resource.proto";
import "pilab/pivirtd/v1/pivirtd.proto";
import "pilab/resource/v1/resource.proto";

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/director/v2;directorv2";

service HostAdminService {
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc GetHost(GetHostRequest) returns (GetHostResponse);
  // SetMaintenance toggles maintenance mode. A host in maintenance is
  // skipped by VM placement. With evacuate set, entering maintenance also
  // live-migrates every running VM off the host; each VM's outcome is
  // reported in evacuations.
  rpc SetMaintenance(SetMaintenanceRequest) returns (SetMaintenanceResponse);
  // MigrateVM live-migrates a running VM to another host (vMotion). An
  // empty target_host_id lets placement pick the best eligible host in
  // the VM's cluster. The migration runs as a task; its id is returned.
  rpc MigrateVM(MigrateVMRequest) returns (MigrateVMResponse);
  // ApplyHostResources ships host objects to the host's agent and returns the
  // per-object outcome once the agent answers (or the timeout elapses).
  rpc ApplyHostResources(ApplyHostResourcesRequest) returns (ApplyHostResourcesResponse);

  // ListHostResources reads host objects of one kind back from the host's
  // pivirtd through its agent, optionally filtered by a label selector.
  rpc ListHostResources(ListHostResourcesRequest) returns (ListHostResourcesResponse);

  // CreateDisk creates a standalone disk image on the host, optionally
  // allocated from one of its storage pools.
  rpc CreateDisk(CreateDiskRequest) returns (CreateDiskResponse);

  // DeleteDisk removes a standalone disk image created by CreateDisk.
  rpc DeleteDisk(DeleteDiskRequest) returns (DeleteDiskResponse);

  // ResizeDisk grows a standalone disk image. Shrinking is refused: a
  // filesystem may already fill the disk.
  rpc ResizeDisk(ResizeDiskRequest) returns (ResizeDiskResponse);

  // SetDiskQoS sets a VirtualDisk's own QoS override, or clears it so the
  // disk follows its pool default again. A running VM's throttling is
  // updated live where the backend supports it.
  rpc SetDiskQoS(SetDiskQoSRequest) returns (SetDiskQoSResponse);

  // GetDiskQoS returns the QoS the disk will actually get: its own override
  // or the inherited pool default, and which of the two it is.
  rpc GetDiskQoS(GetDiskQoSRequest) returns (GetDiskQoSResponse);

  // RebootHost reboots the hypervisor through its agent. The host should be
  // in maintenance unless force is set.
  rpc RebootHost(RebootHostRequest) returns (RebootHostResponse);

  // PowerOffHost powers the hypervisor off through its agent. The host
  // should be in maintenance unless force is set.
  rpc PowerOffHost(PowerOffHostRequest) returns (PowerOffHostResponse);

  // DeleteHost removes a host from the inventory. The host must be in
  // maintenance, and is refused while VMs remain on it unless force is set.
  rpc DeleteHost(DeleteHostRequest) returns (DeleteHostResponse);

  // GetHostStats returns the latest utilisation sample the host's agent
  // reported.
  rpc GetHostStats(GetHostStatsRequest) returns (GetHostStatsResponse);

  // GetHostHardware returns the physical hardware inventory (disks, network
  // adapters and PCI devices) the host's agent last reported. Inventory is
  // remembered per host and refreshed by the agent's periodic host report;
  // an empty response with no reported_at means the host has not reported
  // hardware yet.
  rpc GetHostHardware(GetHostHardwareRequest) returns (GetHostHardwareResponse);

  // ListInventoryVolumes lists the disks of the VMs in the inventory, optionally
  // narrowed to one host.
  rpc ListInventoryVolumes(ListInventoryVolumesRequest) returns (ListInventoryVolumesResponse);

  // ListDirectorTasks lists recent director tasks, newest first.
  rpc ListDirectorTasks(ListDirectorTasksRequest) returns (ListDirectorTasksResponse);
}

message Host {
  string id = 1;
  string name = 2;
  string hostname = 3;
  string address = 4;
  string status = 5;
  string cluster = 6;
  string datacenter = 7;
  repeated string labels = 8;
  bool maintenance = 9;
  string maintenance_reason = 10;
  // connected is true while the host's agent holds a live session.
  bool connected = 11;
  int32 machine_count = 12;
  int32 physical_cpus = 13;
  int64 memory_total_mb = 14;
  bool kvm_available = 15;
}

message ListHostsRequest {
  string cluster = 1;
}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message GetHostRequest {
  string id = 1;
}

message GetHostResponse {
  Host host = 1;
}

message SetMaintenanceResponse {
  Host host = 1;
  repeated Evacuation evacuations = 2;
}

message SetMaintenanceRequest {
  string id = 1;
  bool enabled = 2;
  string reason = 3;
  // evacuate live-migrates the host's running VMs away when entering
  // maintenance. Ignored when leaving maintenance.
  bool evacuate = 4;
}

// Evacuation is one VM's outcome while a host enters maintenance.
message Evacuation {
  string vm_id = 1;
  string vm_name = 2;
  string target_host_id = 3;
  // task_id is set when the migration was dispatched.
  string task_id = 4;
  // error is set when the VM could not be moved.
  string error = 5;
}

message MigrateVMRequest {
  string vm_id = 1;
  // target_host_id is optional; empty picks a host by placement.
  string target_host_id = 2;
  // max_bandwidth_bytes_sec caps the memory stream; 0 uses the default.
  int64 max_bandwidth_bytes_sec = 3;
  // max_downtime_ms bounds the final switchover pause; 0 uses the default.
  int64 max_downtime_ms = 4;
}

message MigrateVMResponse {
  string task_id = 1;
  string source_host_id = 2;
  string target_host_id = 3;
  // storage_mode is SHARED_ZERO_COPY or STORAGE_COPY.
  string storage_mode = 4;
}

message ApplyHostResourcesRequest {
  string host_id = 1;
  repeated pilab.resource.v1.Resource apply = 2;
  repeated ResourceRef delete = 3;
  // timeout_seconds bounds the wait for the agent's answer; 0 means 60.
  int32 timeout_seconds = 4;
}

message ApplyHostResourcesResponse {
  ResourceResultEvent result = 1;
}

message ListHostResourcesRequest {
  string host_id = 1;
  // kind is the host object kind, e.g. "StoragePool" or "HostBridge".
  string kind = 2;
  // selector is a label selector ("k=v,k2!=v2"); empty matches everything.
  string selector = 3;
  // timeout_seconds bounds the wait for the agent's answer; 0 means 60.
  int32 timeout_seconds = 4;
}

message ListHostResourcesResponse {
  repeated pilab.resource.v1.Resource resources = 1;
}

message CreateDiskRequest {
  string host_id = 1;
  string name = 2;
  // pool names a storage pool on the host; empty requires path.
  string pool = 3;
  // path is an explicit image path, used when pool is empty.
  string path = 4;
  int32 size_gb = 5;
  // format is "qcow2" (default) or "raw".
  string format = 6;
  int32 timeout_seconds = 7;
}

message CreateDiskResponse {
  ResourceOutcome outcome = 1;
}

message DeleteDiskRequest {
  string host_id = 1;
  string name = 2;
  int32 timeout_seconds = 3;
}

message DeleteDiskResponse {
  ResourceOutcome outcome = 1;
}

message ResizeDiskRequest {
  string host_id = 1;
  string name = 2;
  // size_gb is the disk's new total size, not the amount to add.
  int32 size_gb = 3;
  int32 timeout_seconds = 4;
}

message ResizeDiskResponse {
  ResourceOutcome outcome = 1;
}

// DiskQoS is a disk's effective throttling and where it came from.
message DiskQoS {
  // effective is the configuration the disk is limited to.
  pilab.core.v1.DiskQoSConfig effective = 1;
  // inherited is true when the disk has no override and follows the pool
  // default (or the platform baseline when the pool has none).
  bool inherited = 2;
  // pool_default_qos is what the disk would inherit, when it has a pool.
  pilab.core.v1.DiskQoSConfig pool_default_qos = 3;
  // live is true when the running VM's throttling was updated right away,
  // rather than only stored for the next start.
  bool live = 4;
  // message explains a partial outcome, such as a stored change that a
  // running VM could not receive.
  string message = 5;
}

message SetDiskQoSRequest {
  string host_id = 1;
  string disk = 2;
  // qos is the disk's own override. Ignored when inherit is true.
  pilab.core.v1.DiskQoSConfig qos = 3;
  // inherit clears the override so the disk follows its pool default.
  bool inherit = 4;
  int32 timeout_seconds = 5;
}

message SetDiskQoSResponse {
  DiskQoS qos = 1;
  ResourceOutcome outcome = 2;
}

message GetDiskQoSRequest {
  string host_id = 1;
  string disk = 2;
}

message GetDiskQoSResponse {
  DiskQoS qos = 1;
}

message RebootHostRequest {
  string id = 1;
  // force reboots even when the host is not in maintenance.
  bool force = 2;
  string reason = 3;
  int32 timeout_seconds = 4;
}

message RebootHostResponse {
  ResourceOutcome outcome = 1;
}

message PowerOffHostRequest {
  string id = 1;
  // force powers off even when the host is not in maintenance.
  bool force = 2;
  string reason = 3;
  int32 timeout_seconds = 4;
}

message PowerOffHostResponse {
  ResourceOutcome outcome = 1;
}

message DeleteHostRequest {
  string id = 1;
  // force deletes the host even though VMs are still recorded on it.
  bool force = 2;
}

message DeleteHostResponse {}

message GetHostStatsRequest {
  string id = 1;
}

message GetHostStatsResponse {
  string host_id = 1;
  // stats is the latest HostStats the host's agent reported.
  pilab.pivirtd.v1.HostStats stats = 2;
}

message GetHostHardwareRequest {
  string id = 1;
}

message GetHostHardwareResponse {
  string host_id = 1;
  repeated pilab.pivirtd.v1.HostDisk disks = 2;
  repeated pilab.pivirtd.v1.HostNetworkAdapter network_adapters = 3;
  repeated pilab.pivirtd.v1.HostPCIDeviceInfo pci_devices = 4;
  // reported_at is when the agent last sent this inventory; unset when the
  // host has never reported hardware.
  google.protobuf.Timestamp reported_at = 5;
}

message InventoryVolume {
  // id is "<vm_id>/<name>".
  string id = 1;
  string name = 2;
  string path = 3;
  int64 size_bytes = 4;
  string type = 5;
  string bus = 6;
  string device = 7;
  string vm_id = 8;
  string vm_name = 9;
  string host_id = 10;
}

message ListInventoryVolumesRequest {
  // host_id narrows the list to one host; empty lists every host.
  string host_id = 1;
}

message ListInventoryVolumesResponse {
  repeated InventoryVolume volumes = 1;
}

message ListDirectorTasksRequest {
  // limit caps the result; 0 means 100, the maximum is 1000.
  int32 limit = 1;
  // host_id keeps only tasks targeting this host.
  string host_id = 2;
  // vm_id keeps only tasks targeting this VM.
  string vm_id = 3;
  // statuses keeps only tasks in one of these states; empty keeps all.
  repeated TaskStatus statuses = 4;
}

message ListDirectorTasksResponse {
  repeated Task tasks = 1;
}
