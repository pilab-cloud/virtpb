syntax = "proto3";

package pilab.cloud.core.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/core/v1;corev1";

import "google/protobuf/timestamp.proto";

// DatastoreService is the director's cluster-wide view of storage: every
// datastore the hosts report, which hosts are connected to it, its capacity
// and its health (vSphere datastore inventory).
service DatastoreService {
  rpc ListDatastores(ListDatastoresRequest) returns (ListDatastoresResponse);
  rpc GetDatastore(GetDatastoreRequest) returns (GetDatastoreResponse);
  // CreateDatastore defines the datastore on every target host. The work runs
  // as one task per host; the response lists them.
  rpc CreateDatastore(CreateDatastoreRequest) returns (CreateDatastoreResponse);
  rpc DeleteDatastore(DeleteDatastoreRequest) returns (DatastoreOperationResponse);
  // ActivateDatastore mounts / logs in the datastore on the target hosts.
  rpc ActivateDatastore(DatastoreHostsRequest) returns (DatastoreOperationResponse);
  rpc DeactivateDatastore(DatastoreHostsRequest) returns (DatastoreOperationResponse);
}

enum DatastoreHealth {
  DATASTORE_HEALTH_UNSPECIFIED = 0;
  DATASTORE_HEALTH_OK = 1;
  // Usable but at risk: running low on space, or a host that should see it
  // does not.
  DATASTORE_HEALTH_DEGRADED = 2;
  // No active host can reach it.
  DATASTORE_HEALTH_OFFLINE = 3;
}

message DatastoreHost {
  string host_id = 1;
  string host_name = 2;
  // False when the host is down, in maintenance or has not reported it lately.
  bool connected = 3;
  int64 total_bytes = 4;
  int64 available_bytes = 5;
  string mount_path = 6;
}

message Datastore {
  string id = 1;
  string name = 2;
  // local, nfs, iscsi, ceph, ...
  string kind = 3;
  // Visible to more than one host, so VMs on it migrate without a disk copy.
  bool shared = 4;
  int64 total_bytes = 5;
  int64 available_bytes = 6;
  double used_percent = 7;
  DatastoreHealth health = 8;
  repeated string health_reasons = 9;
  repeated DatastoreHost hosts = 10;
  repeated string clusters = 11;
  google.protobuf.Timestamp last_report_at = 12;
}

message ListDatastoresRequest {
  // Only datastores connected to this host.
  string host_id = 1;
  // Only datastores of this cluster.
  string cluster_id = 2;
}

message ListDatastoresResponse {
  repeated Datastore datastores = 1;
}

message GetDatastoreRequest {
  string id = 1;
}

message GetDatastoreResponse {
  Datastore datastore = 1;
}

// ZfsDatastoreBacking describes a ZFS-backed datastore: a dataset (or zvol
// hierarchy) on the given pool.
message ZfsDatastoreBacking {
  string zpool = 1;
  string dataset = 2;
  bool create = 3;
  string mountpoint = 4;
  string compression = 5;
  string recordsize = 6;
  string volblocksize = 7;
}

message CreateDatastoreRequest {
  string name = 1;
  // dir, nfs, iscsi, ceph or zfs.
  string type = 2;
  // Mount path on the host, e.g. /var/lib/pivirt/datastores/gold.
  string path = 3;
  // Backend settings, e.g. server and export for nfs, portal and target for
  // iscsi.
  map<string, string> options = 4;
  // Hosts to define it on. Empty means every active host of cluster_id.
  repeated string host_ids = 5;
  string cluster_id = 6;
  // Backend-specific definition. Unset keeps the legacy type/options behaviour.
  oneof backing {
    ZfsDatastoreBacking zfs = 20;
  }
}

message DatastoreOperation {
  string host_id = 1;
  // Task running the change on the host; empty when it could not be queued.
  string task_id = 2;
  string error = 3;
}

message CreateDatastoreResponse {
  // Cluster-wide datastore id: the same on every host.
  string datastore_id = 1;
  repeated DatastoreOperation operations = 2;
}

message DatastoreHostsRequest {
  string id = 1;
  // Hosts to act on. Empty means every host that has the datastore.
  repeated string host_ids = 2;
}

message DeleteDatastoreRequest {
  string id = 1;
  repeated string host_ids = 2;
  // Delete even while VMs still have disks on it.
  bool force = 3;
}

message DatastoreOperationResponse {
  repeated DatastoreOperation operations = 1;
}
