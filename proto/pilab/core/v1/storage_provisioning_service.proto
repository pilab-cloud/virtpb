syntax = "proto3";

package pilab.core.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/core/v1;corev1";

import "google/protobuf/timestamp.proto";

// ==========================================
// Storage Provisioning Service
// Manage physical disks, partition tables,
// LVM (PV/VG/LV), and ZFS (pools/datasets/zvols)
// ==========================================

enum PartitionTableType {
  PARTITION_TABLE_TYPE_UNSPECIFIED = 0;
  PARTITION_TABLE_TYPE_GPT = 1;
  PARTITION_TABLE_TYPE_MBR = 2;
}

enum PartitionType {
  PARTITION_TYPE_UNSPECIFIED = 0;
  PARTITION_TYPE_LINUX_FS = 1; // 8300 / ext4, xfs
  PARTITION_TYPE_LINUX_LVM = 2; // 8e00
  PARTITION_TYPE_LINUX_ZFS = 3; // bf00
  PARTITION_TYPE_LINUX_SWAP = 4; // 8200
}

enum FileSystemType {
  FILE_SYSTEM_TYPE_UNSPECIFIED = 0;
  FILE_SYSTEM_TYPE_EXT4 = 1;
  FILE_SYSTEM_TYPE_XFS = 2;
  FILE_SYSTEM_TYPE_SWAP = 3;
}

enum ZfsRaidType {
  ZFS_RAID_TYPE_UNSPECIFIED = 0;
  ZFS_RAID_TYPE_STRIPE = 1;
  ZFS_RAID_TYPE_MIRROR = 2;
  ZFS_RAID_TYPE_RAIDZ1 = 3;
  ZFS_RAID_TYPE_RAIDZ2 = 4;
  ZFS_RAID_TYPE_RAIDZ3 = 5;
}

// ---------------- Block Devices / Disks ----------------

message BlockDevice {
  string name = 1;              // e.g. "sda", "nvme0n1"
  string path = 2;              // e.g. "/dev/sda", "/dev/nvme0n1"
  int64 size_bytes = 3;
  string size_human = 4;        // e.g. "14.6T", "476.9G"
  string type = 5;              // "disk", "part", "loop", "lvm", "zfs"
  string fstype = 6;            // e.g. "ext4", "zfs_member", "LVM2_member"
  string label = 7;
  string uuid = 8;
  repeated string mountpoints = 9;
  string model = 10;
  string serial = 11;
  bool read_only = 12;
  string partition_table_type = 13; // "gpt", "dos", "unknown"
  bool is_system_disk = 14;     // true if carries root (/), /boot, or swap
  repeated BlockDevice children = 15;
  // Hardware / SAN identity used by the shared-LVM pre-flight.
  string scsi_wwid = 16;        // /dev/disk/by-id/scsi-<wwid>
  string multipath_path = 17;   // /dev/mapper/<name> when multipath is active
  string vendor = 18;
  string device_id = 19;
  string iscsi_session = 20;    // e.g. "session1" when the device is an iSCSI LUN
  string lvm_vg = 21;           // volume group when the device/LV belongs to one
}

message ListDevicesRequest {
  string node_id = 1;           // Optional: target node ID/hostname. Empty = aggregate all nodes
}

message ListDevicesResponse {
  string node_id = 1;
  string hostname = 2;
  repeated BlockDevice devices = 3;
}

message InitializeDiskRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda"
  PartitionTableType table_type = 3; // GPT or MBR
  bool wipe_existing = 4;       // run wipefs first
}

message InitializeDiskResponse {
  bool success = 1;
  string message = 2;
  string device = 3;
}

message WipeDiskRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda"
}

message WipeDiskResponse {
  bool success = 1;
  string message = 2;
}

message RescanDevicesRequest {
  string node_id = 1;
}

message RescanDevicesResponse {
  string node_id = 1;
  string hostname = 2;
  repeated BlockDevice devices = 3;
  string message = 4;
}

message DiskHealth {
  string device = 1;
  bool healthy = 2;
  // status is the SMART overall-health value, e.g. "PASSED", "FAILED",
  // "UNKNOWN" when smartctl is unavailable.
  string status = 3;
  int32 temperature_celsius = 4;
  int64 power_on_hours = 5;
  int64 reallocated_sectors = 6;
  int64 pending_sectors = 7;
  int64 wear_level_percent = 8;
  string model = 9;
  string serial = 10;
  string detail = 11;
}

message GetDiskHealthRequest {
  string node_id = 1;
  string device = 2;
}

message GetDiskHealthResponse {
  DiskHealth health = 1;
}

// ---------------- Partitions ----------------

message CreatePartitionRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda"
  PartitionType partition_type = 3;
  int64 size_mb = 4;            // 0 = allocate all remaining free space
  string name = 5;              // partition label/name
}

message CreatePartitionResponse {
  bool success = 1;
  string message = 2;
  string partition_device = 3;  // e.g. "/dev/sda1"
  uint32 partition_number = 4;
}

message DeletePartitionRequest {
  string node_id = 1;
  string device = 2;            // disk e.g. "/dev/sda" or partition "/dev/sda1"
  uint32 partition_number = 3;  // optional if partition device provided
}

message DeletePartitionResponse {
  bool success = 1;
  string message = 2;
}

message FormatPartitionRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda1"
  FileSystemType fs_type = 3;   // EXT4, XFS
  string label = 4;
}

message FormatPartitionResponse {
  bool success = 1;
  string message = 2;
}

message MountFilesystemRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda1" or "/dev/vg/lv"
  string mount_point = 3;       // absolute host path
  string fs_type = 4;           // optional; auto-detected when empty
  repeated string options = 5;  // mount options, e.g. ["noatime"]
  bool create_mountpoint = 6;
  // persist=true asks the agent to make the mount survive reboot.
  bool persist = 7;
}

message MountFilesystemResponse {
  bool success = 1;
  string message = 2;
  string mount_point = 3;
}

message UnmountFilesystemRequest {
  string node_id = 1;
  string mount_point = 2;
  bool force = 3;
}

message UnmountFilesystemResponse {
  bool success = 1;
  string message = 2;
}

message ResizePartitionRequest {
  string node_id = 1;
  string device = 2;            // disk e.g. "/dev/sda"
  uint32 partition_number = 3;
  // size_mb is the new partition size; 0 grows to the end of the disk.
  int64 size_mb = 4;
  // resize_filesystem grows ext4/xfs after the partition is resized.
  bool resize_filesystem = 5;
}

message ResizePartitionResponse {
  bool success = 1;
  string message = 2;
  string partition_device = 3;
  int64 size_bytes = 4;
}

// ---------------- LVM ----------------

message LvmPv {
  string name = 1;              // e.g. "/dev/sda2"
  string vg_name = 2;
  int64 size_bytes = 3;
  int64 free_bytes = 4;
}

message LvmVg {
  string name = 1;              // e.g. "vg_data"
  int64 size_bytes = 2;
  int64 free_bytes = 3;
  uint32 pv_count = 4;
  uint32 lv_count = 5;
}

message LvmLv {
  string name = 1;              // e.g. "lv_vms"
  string vg_name = 2;
  string path = 3;              // e.g. "/dev/vg_data/lv_vms"
  int64 size_bytes = 4;
  string pool_name = 5;
  bool is_thin = 6;
}

message ListLvmRequest {
  string node_id = 1;
}

message ListLvmResponse {
  string node_id = 1;
  repeated LvmPv pvs = 2;
  repeated LvmVg vgs = 3;
  repeated LvmLv lvs = 4;
}

message CreateLvmPvRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda2"
}

message CreateLvmPvResponse {
  bool success = 1;
  string message = 2;
}

message RemoveLvmPvRequest {
  string node_id = 1;
  string device = 2;
}

message RemoveLvmPvResponse {
  bool success = 1;
  string message = 2;
}

message CreateLvmVgRequest {
  string node_id = 1;
  string vg_name = 2;
  repeated string devices = 3;  // PV devices e.g. ["/dev/sda2"]
}

message CreateLvmVgResponse {
  bool success = 1;
  string message = 2;
}

message RemoveLvmVgRequest {
  string node_id = 1;
  string vg_name = 2;
}

message RemoveLvmVgResponse {
  bool success = 1;
  string message = 2;
}

message CreateLvmLvRequest {
  string node_id = 1;
  string vg_name = 2;
  string lv_name = 3;
  int64 size_mb = 4;
  bool is_thin = 5;
  string thin_pool_name = 6;
}

message CreateLvmLvResponse {
  bool success = 1;
  string message = 2;
  string lv_path = 3;
}

message RemoveLvmLvRequest {
  string node_id = 1;
  string vg_name = 2;
  string lv_name = 3;
}

message RemoveLvmLvResponse {
  bool success = 1;
  string message = 2;
}

message CreateLvmThinPoolRequest {
  string node_id = 1;
  string vg_name = 2;
  string pool_name = 3;
  int64 size_mb = 4;            // 0 uses all free extents in the VG
  int64 chunk_size_kb = 5;      // optional; e.g. 128
  int64 metadata_size_mb = 6;   // optional
}

message CreateLvmThinPoolResponse {
  bool success = 1;
  string message = 2;
  string pool_path = 3;         // e.g. "/dev/vg_fast/pool_vms"
}

// ---------------- ZFS ----------------

message ZfsPool {
  string name = 1;              // e.g. "tank", "bulk"
  string state = 2;             // ONLINE, DEGRADED, FAULTED
  int64 size_bytes = 3;
  int64 alloc_bytes = 4;
  int64 free_bytes = 5;
  string health = 6;
  string mountpoint = 7;
  repeated string vdevs = 8;
  string scan_status = 9;
}

message ZfsDataset {
  string name = 1;              // e.g. "tank/vms", "bulk/images"
  string pool = 2;
  string type = 3;              // "filesystem", "volume"
  string mountpoint = 4;
  int64 used_bytes = 5;
  int64 avail_bytes = 6;
  string compression = 7;
}

message ListZfsRequest {
  string node_id = 1;
}

message ListZfsResponse {
  string node_id = 1;
  repeated ZfsPool pools = 2;
  repeated ZfsDataset datasets = 3;
}

message CreateZpoolRequest {
  string node_id = 1;
  string pool_name = 2;
  ZfsRaidType raid_type = 3;    // STRIPE, MIRROR, RAIDZ1, RAIDZ2
  repeated string devices = 4;  // e.g. ["/dev/sdb1"] or ["/dev/sda", "/dev/sdb"]
  string mountpoint = 5;        // e.g. "/tank" or "none"
  uint32 ashift = 6;            // default 12 (4K sectors)
  map<string, string> properties = 7; // e.g. compression=zstd
}

message CreateZpoolResponse {
  bool success = 1;
  string message = 2;
}

message DestroyZpoolRequest {
  string node_id = 1;
  string pool_name = 2;
  bool force = 3;
}

message DestroyZpoolResponse {
  bool success = 1;
  string message = 2;
}

message CreateZfsDatasetRequest {
  string node_id = 1;
  string dataset_name = 2;      // e.g. "tank/vms"
  string mountpoint = 3;
  map<string, string> properties = 4; // e.g. compression=zstd
}

message CreateZfsDatasetResponse {
  bool success = 1;
  string message = 2;
}

message DestroyZfsDatasetRequest {
  string node_id = 1;
  string dataset_name = 2;
  bool recursive = 3;
}

message DestroyZfsDatasetResponse {
  bool success = 1;
  string message = 2;
}

message CreateZfsZvolRequest {
  string node_id = 1;
  string pool_name = 2;         // e.g. "tank"
  string zvol_name = 3;         // e.g. "vm-disk-100"
  int64 size_mb = 4;
  string blocksize = 5;         // default "64k"
  bool sparse = 6;              // thin-provisioned
}

message CreateZfsZvolResponse {
  bool success = 1;
  string message = 2;
  string zvol_device = 3;       // e.g. "/dev/zvol/tank/vm-disk-100"
}

// ---------------- Storage Pools & QoS Architecture ----------------

enum StoragePoolScope {
  STORAGE_POOL_SCOPE_UNSPECIFIED = 0;
  STORAGE_POOL_SCOPE_NODE_LOCAL = 1;     // Bound to a single hypervisor (local NVMe, SSD, local ZFS)
  STORAGE_POOL_SCOPE_CLUSTER_SHARED = 2;  // Accessible across all hypervisors (Ceph RBD, NFS, shared iSCSI)
}

enum StoragePoolDriver {
  STORAGE_POOL_DRIVER_UNSPECIFIED = 0;
  STORAGE_POOL_DRIVER_CEPH_RBD = 1;       // Native QEMU librbd
  STORAGE_POOL_DRIVER_DIR = 2;            // Filesystem directory (qcow2/raw)
  STORAGE_POOL_DRIVER_ZFS = 3;            // ZFS dataset or zvol
  STORAGE_POOL_DRIVER_LVM_THIN = 4;       // LVM Thin pool
  STORAGE_POOL_DRIVER_NFS = 5;            // NFSv4 mount
  STORAGE_POOL_DRIVER_ISCSI = 6;          // iSCSI target/LUN
}

// Inheritable Disk QoS Configuration
message DiskQoSConfig {
  // IOPS Limits (Mandatory default: 2500, burst: 5000)
  int64 total_iops = 1;
  int64 read_iops = 2;
  int64 write_iops = 3;
  int64 iops_burst = 4;
  int64 iops_burst_duration_sec = 5; // seconds

  // Bandwidth Limits in bytes/sec (Mandatory default: 157286400 = 150MB/s, burst: 314572800 = 300MB/s)
  int64 total_bytes_sec = 6;
  int64 read_bytes_sec = 7;
  int64 write_bytes_sec = 8;
  int64 bytes_burst = 9;

  // Cgroups v2 blkio weight (100 - 1000, default: 500)
  int32 io_weight = 10;
  
  // When true, tracks the backing StoragePool's default_qos dynamically
  bool inherit_from_pool = 11;
}

// Ceph RBD Backing Specification
message CephPoolBacking {
  repeated string monitors = 1;      // e.g. ["10.99.0.10:6789", "10.99.0.3:6789"]
  string pool_name = 2;              // e.g. "rbd-vms"
  string user = 3;                   // e.g. "pivirt" or "admin"
  string keyring_path = 4;           // e.g. "/etc/ceph/ceph.client.pivirt.keyring"
  string conf_path = 5;              // e.g. "/etc/ceph/ceph.conf"
}

// ZFS Pool Backing Specification
message ZfsPoolBacking {
  string zpool_name = 1;             // e.g. "tank"
  string dataset_name = 2;           // e.g. "tank/vms"
}

// LVM Thin Pool Backing Specification
message LvmPoolBacking {
  string vg_name = 1;                // e.g. "vg_fast"
  string thin_pool_name = 2;         // e.g. "pool_vms"
}

// NFS Pool Backing Specification
message NfsPoolBacking {
  string server = 1;                 // e.g. "10.99.0.100"
  string export_path = 2;            // e.g. "/srv/nfs/vms"
  string mount_options = 3;          // e.g. "rw,noatime,hard,intr,vers=4.2"
}

// Directory Pool Backing Specification
message DirPoolBacking {
  string path = 1;                   // e.g. "/var/lib/pivirt/storage"
}

// Full StoragePool representation
message StoragePoolDescriptor {
  string id = 1;
  string name = 2;
  StoragePoolScope scope = 3;
  StoragePoolDriver driver = 4;
  string mount_point = 5;            // Host mount point if applicable

  bool is_shared = 6;                // True if cluster-shared (e.g. Ceph RBD, NFS)
  bool thin_provisioning = 7;        // Supports thin allocation
  repeated string supported_formats = 8; // ["raw", "qcow2", "zvol"]

  DiskQoSConfig default_qos = 9;     // Default QoS inherited by all disks

  int64 total_bytes = 10;
  int64 available_bytes = 11;
  int64 allocated_bytes = 12;

  repeated string mounted_node_ids = 13; // Nodes currently connected / mounting

  oneof backing {
    CephPoolBacking ceph = 20;
    ZfsPoolBacking zfs = 21;
    LvmPoolBacking lvm = 22;
    NfsPoolBacking nfs = 23;
    DirPoolBacking dir = 24;
  }
}

// Storage Pool RPC Messages
message ListStoragePoolsRequest {
  string node_id = 1; // Optional: filter by node accessibility
}

message ListStoragePoolsResponse {
  repeated StoragePoolDescriptor pools = 1;
}

message GetStoragePoolRequest {
  string id_or_name = 1;
}

message GetStoragePoolResponse {
  StoragePoolDescriptor pool = 1;
}

message CreateStoragePoolRequest {
  StoragePoolDescriptor pool = 1;
}

message CreateStoragePoolResponse {
  bool success = 1;
  string message = 2;
  StoragePoolDescriptor pool = 3;
}

message UpdateStoragePoolRequest {
  StoragePoolDescriptor pool = 1;
}

message UpdateStoragePoolResponse {
  bool success = 1;
  string message = 2;
  StoragePoolDescriptor pool = 3;
}

message DeleteStoragePoolRequest {
  string id_or_name = 1;
  bool force = 2;
}

message DeleteStoragePoolResponse {
  bool success = 1;
  string message = 2;
}

// ---------------- Volume Lifecycle on Storage Pools ----------------

message StorageVolume {
  string id = 1;
  string name = 2;              // e.g. "vm-prod-100-disk0"
  string pool_name = 3;         // e.g. "ceph-shared" or "local-tank"
  string pool_id = 4;
  StoragePoolDriver driver = 5; // CEPH_RBD, ZFS, LVM_THIN, DIR
  string volume_path = 6;       // e.g. "rbd:rbd-vms/vm-prod-100-disk0" or "/dev/zvol/tank/vms/vm-100"
  int64 size_bytes = 7;
  string size_human = 8;
  string format = 9;            // "raw", "qcow2"
  bool is_shared = 10;
  DiskQoSConfig qos = 11;
  google.protobuf.Timestamp created_at = 12;
}

message CreateVolumeRequest {
  string node_id = 1;           // Target node if node-local pool, or empty for cluster-shared
  string pool_name = 2;         // e.g. "ceph-shared"
  string volume_name = 3;       // e.g. "vm-test-disk0"
  int64 size_mb = 4;
  string format = 5;            // "raw", "qcow2" (default: "raw" for Ceph, "qcow2" for Dir)
  DiskQoSConfig qos = 6;        // Optional QoS overrides; if nil/zero, inherits pool.default_qos
}

message CreateVolumeResponse {
  bool success = 1;
  string message = 2;
  StorageVolume volume = 3;
}

message DeleteVolumeRequest {
  string node_id = 1;
  string pool_name = 2;
  string volume_name = 3;
  bool force = 4;
}

message DeleteVolumeResponse {
  bool success = 1;
  string message = 2;
}

message ResizeVolumeRequest {
  string node_id = 1;
  string pool_name = 2;
  string volume_name = 3;
  int64 new_size_mb = 4;
}

message ResizeVolumeResponse {
  bool success = 1;
  string message = 2;
  StorageVolume volume = 3;
}

message ListVolumesRequest {
  string node_id = 1;
  string pool_name = 2;         // e.g. "ceph-shared"
}

message ListVolumesResponse {
  repeated StorageVolume volumes = 1;
}

// Live Dynamic Disk QoS Throttling RPC Messages
message SetDiskQoSRequest {
  string node_id = 1;
  string vm_id = 2;
  string device_or_drive_id = 3;     // e.g. "drive-virtio-disk0" or "vda"
  DiskQoSConfig qos = 4;
}

message SetDiskQoSResponse {
  bool success = 1;
  string message = 2;
  DiskQoSConfig applied_qos = 3;
}

message GetDiskQoSRequest {
  string node_id = 1;
  string vm_id = 2;
  string device_or_drive_id = 3;
}

message GetDiskQoSResponse {
  DiskQoSConfig qos = 1;
}

// Migration Storage Pre-flight Check
enum MigrationStorageMode {
  MIGRATION_STORAGE_MODE_UNSPECIFIED = 0;
  MIGRATION_STORAGE_MODE_SHARED_ZERO_COPY = 1; // All disks are on shared storage (Ceph/NFS); zero disk copy needed
  MIGRATION_STORAGE_MODE_STORAGE_COPY = 2;      // At least one disk is local; requires QEMU block mirroring
}

message NonSharedDiskInfo {
  string disk_id = 1;
  string device = 2;
  string path = 3;
  string storage_pool = 4;
  int64 size_bytes = 5;
  string reason = 6; // e.g. "Pool 'local-nvme' is NodeLocal to Hades"
}

message CheckMigrationStorageRequest {
  string vm_id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  repeated BlockDevice disks = 4; // Optional: specific disks to check if known by caller
}

message CheckMigrationStorageResponse {
  MigrationStorageMode mode = 1;
  bool can_zero_copy = 2;
  repeated NonSharedDiskInfo non_shared_disks = 3;
  string recommendation = 4;
}


// ==========================================
// Software RAID (mdadm)
// ==========================================

enum RaidLevel {
  RAID_LEVEL_UNSPECIFIED = 0;
  RAID_LEVEL_LINEAR = 1;
  RAID_LEVEL_0 = 2;
  RAID_LEVEL_1 = 3;
  RAID_LEVEL_5 = 4;
  RAID_LEVEL_6 = 5;
  RAID_LEVEL_10 = 6;
}

enum RaidState {
  RAID_STATE_UNSPECIFIED = 0;
  RAID_STATE_ACTIVE = 1;
  // Running with fewer members than the level expects.
  RAID_STATE_DEGRADED = 2;
  // A member is being rebuilt or a reshape is in progress.
  RAID_STATE_RECOVERING = 3;
  RAID_STATE_FAILED = 4;
  // Assembled or defined, but not started.
  RAID_STATE_INACTIVE = 5;
}

message RaidMember {
  // device is the member's block device, e.g. /dev/sdb.
  string device = 1;
  // role is the member's position in the array, as mdadm reports it.
  int32 role = 2;
  // state is mdadm's own word: "active", "spare", "faulty", "removed", ...
  string state = 3;
  bool failed = 4;
  bool write_mostly = 5;
  // rebuild_percent is the member's own recovery progress, when it is the one
  // being rebuilt.
  double rebuild_percent = 6;
}

message RaidSet {
  // name is the array's name: mdadm's /dev/md/<name>, or the kernel's mdN.
  string name = 1;
  // device is the array's block device, e.g. /dev/md0.
  string device = 2;
  RaidLevel level = 3;
  RaidState state = 4;
  // raid_devices is how many members the array is defined to have.
  int32 raid_devices = 5;
  int64 size_bytes = 6;
  int64 chunk_size_kb = 7;
  repeated RaidMember members = 8;
  // rebuild_percent is the overall resync/reshape progress, 100 when idle.
  double rebuild_percent = 9;
  // operation names what the kernel is doing now ("resync", "recovery",
  // "reshape", "check", "repair") and is empty when idle.
  string operation = 10;
  google.protobuf.Timestamp created_at = 11;
  // message explains a state that needs the operator's attention.
  string message = 12;
  // warnings are the array's caveats, e.g. the RAID5 write hole.
  repeated string warnings = 13;
  // in_use is true when a filesystem, LV or zpool is using the array.
  bool in_use = 14;
  repeated string used_by = 15;
}

message ListRaidSetsRequest {
  string node_id = 1;
}

message ListRaidSetsResponse {
  string node_id = 1;
  repeated RaidSet sets = 2;
  // mdadm_available is false when the host has no mdadm, so the UI can say
  // why the list is empty rather than showing "no arrays".
  bool mdadm_available = 3;
  string message = 4;
}

message CreateRaidSetRequest {
  string node_id = 1;
  // name is the array name (mdadm --name); empty lets the kernel pick mdN.
  string name = 2;
  RaidLevel level = 3;
  // devices are the member block devices, in order.
  repeated string devices = 4;
  int32 chunk_size_kb = 5;
  // force allows reusing members that carry another signature.
  bool force = 6;
}

message CreateRaidSetResponse {
  bool success = 1;
  string message = 2;
  RaidSet set = 3;
}

message AssembleRaidSetRequest {
  string node_id = 1;
  // name or device identifies the array to assemble.
  string name = 2;
  repeated string devices = 3;
  bool force = 4;
}

message AssembleRaidSetResponse {
  bool success = 1;
  string message = 2;
  RaidSet set = 3;
}

message GrowRaidSetRequest {
  string node_id = 1;
  string name = 2;
  // devices are the members to add.
  repeated string devices = 3;
  // size_max grows the array to the largest usable size after adding.
  bool size_max = 4;
}

message GrowRaidSetResponse {
  bool success = 1;
  string message = 2;
  RaidSet set = 3;
}

message FailRaidMemberRequest {
  string node_id = 1;
  string name = 2;
  string device = 3;
}

message FailRaidMemberResponse {
  bool success = 1;
  string message = 2;
  RaidSet set = 3;
}

message RemoveRaidMemberRequest {
  string node_id = 1;
  string name = 2;
  string device = 3;
}

message RemoveRaidMemberResponse {
  bool success = 1;
  string message = 2;
  RaidSet set = 3;
}

message ReplaceRaidMemberRequest {
  string node_id = 1;
  string name = 2;
  // device is the failed member to replace.
  string device = 3;
  // replacement is the new member. It replaces the failed one in place.
  string replacement = 4;
}

message ReplaceRaidMemberResponse {
  bool success = 1;
  string message = 2;
  RaidSet set = 3;
}

message DeleteRaidSetRequest {
  string node_id = 1;
  string name = 2;
  // stop only stops the array and keeps its metadata.
  bool stop_only = 3;
  // force deletes an array that is in use (unmounted or not).
  bool force = 4;
}

message DeleteRaidSetResponse {
  bool success = 1;
  string message = 2;
}


// ==========================================
// Pool Performance Monitoring
// ==========================================

// StorageIoStats is one device's or pool's I/O counters over the sampling
// interval. Rates are computed from the kernel's cumulative counters, so the
// host needs two samples; the first call may return rates of 0 with
// sampled_at set.
message StorageIoStats {
  // id is the device path or the pool name, matching kind.
  string id = 1;
  // kind is "device" or "pool".
  string kind = 2;
  // pool is the pool this device belongs to, when known.
  string pool = 3;
  int64 read_iops = 4;
  int64 write_iops = 5;
  int64 read_bytes_per_sec = 6;
  int64 write_bytes_per_sec = 7;
  double read_latency_ms = 8;
  double write_latency_ms = 9;
  int64 queue_depth = 10;
  int64 io_errors = 11;
  // util_percent is the share of the interval the device was busy.
  double util_percent = 12;
  // members lists a pool's member devices.
  repeated string members = 13;
  google.protobuf.Timestamp sampled_at = 14;
  // source names where the numbers came from: "diskstats", "zpool iostat",
  // "rbd perf", "qmp blockstats".
  string source = 15;
}

message GetStorageIoRequest {
  string node_id = 1;
  // pool narrows the answer to one pool; empty means every pool and device.
  string pool = 2;
}

message GetStorageIoResponse {
  repeated StorageIoStats samples = 1;
  google.protobuf.Timestamp sampled_at = 2;
  // interval_ms is how long the rates were measured over.
  int64 interval_ms = 3;
  repeated string issues = 4;
}

// ==========================================
// Maintenance and Tuning
// ==========================================

enum StorageMaintenanceKind {
  STORAGE_MAINTENANCE_KIND_UNSPECIFIED = 0;
  STORAGE_MAINTENANCE_KIND_SCRUB = 1;
  STORAGE_MAINTENANCE_KIND_TRIM = 2;
  STORAGE_MAINTENANCE_KIND_REPAIR = 3;
  STORAGE_MAINTENANCE_KIND_REBALANCE = 4;
  STORAGE_MAINTENANCE_KIND_VERIFY = 5;
}

enum StorageMaintenanceState {
  STORAGE_MAINTENANCE_STATE_UNSPECIFIED = 0;
  STORAGE_MAINTENANCE_STATE_QUEUED = 1;
  STORAGE_MAINTENANCE_STATE_RUNNING = 2;
  STORAGE_MAINTENANCE_STATE_COMPLETED = 3;
  STORAGE_MAINTENANCE_STATE_FAILED = 4;
  STORAGE_MAINTENANCE_STATE_CANCELED = 5;
  // SKIPPED means the task did not run: busy pool, unsupported, or a
  // previous task still running.
  STORAGE_MAINTENANCE_STATE_SKIPPED = 6;
}

message StorageMaintenanceTask {
  string id = 1;
  string node_id = 2;
  string pool = 3;
  StorageMaintenanceKind kind = 4;
  StorageMaintenanceState state = 5;
  double progress_percent = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  string error = 9;
  string message = 10;
  bool cancelable = 11;
  // trigger is "manual" or "schedule".
  string trigger = 12;
}

message StartStorageMaintenanceRequest {
  string node_id = 1;
  string pool = 2;
  StorageMaintenanceKind kind = 3;
  // priority is the kernel's rebuild/scrub speed class: 1 (low) to 3 (high),
  // 0 leaves the host's setting alone.
  int32 priority = 4;
  // max_duration_seconds stops the task when it runs too long; 0 means no
  // limit.
  int64 max_duration_seconds = 5;
}

message StartStorageMaintenanceResponse {
  StorageMaintenanceTask task = 1;
}

message ListStorageMaintenanceTasksRequest {
  string node_id = 1;
  string pool = 2;
  // limit caps the history returned, newest first. 0 means 50.
  int32 limit = 3;
}

message ListStorageMaintenanceTasksResponse {
  repeated StorageMaintenanceTask tasks = 1;
}

message CancelStorageMaintenanceRequest {
  string node_id = 1;
  string task_id = 2;
}

message CancelStorageMaintenanceResponse {
  StorageMaintenanceTask task = 1;
}

// StorageMaintenancePolicy schedules recurring maintenance on a pool. It is
// stored on the pool, so the host owns the timing and the director only
// declares intent.
message StorageMaintenancePolicy {
  // scrub_interval_hours runs a scrub this often; 0 disables it.
  int64 scrub_interval_hours = 1;
  // trim_interval_hours runs a discard pass this often; 0 disables it.
  int64 trim_interval_hours = 2;
  // max_duration_seconds caps a scheduled task; 0 means no limit.
  int64 max_duration_seconds = 3;
  // skip_if_busy skips a run while another maintenance task is running.
  bool skip_if_busy = 4;
  // priority is the speed class for scheduled tasks.
  int32 priority = 5;
}

// StorageTuningKnob is one tunable setting the backend can actually change.
message StorageTuningKnob {
  // key is a stable name, e.g. "io_scheduler", "read_ahead_kb",
  // "write_cache", "compression", "dedup".
  string key = 1;
  string value = 2;
  // supported is false when this host cannot change the knob; reason says
  // why (missing kernel feature, backend does not expose it, ...).
  bool supported = 3;
  string reason = 4;
  // choices lists the accepted values, when the knob is enumerated.
  repeated string choices = 5;
  // kind is "host" for device settings and "pool" for backend settings.
  string kind = 6;
  bool reboot_required = 7;
}

message GetStorageTuningRequest {
  string node_id = 1;
  string pool = 2;
  // device narrows the answer to one member device; empty means the pool.
  string device = 3;
}

message GetStorageTuningResponse {
  repeated StorageTuningKnob knobs = 1;
  string device = 2;
}

message SetStorageTuningRequest {
  string node_id = 1;
  string pool = 2;
  string device = 3;
  map<string, string> values = 4;
}

message SetStorageTuningResponse {
  repeated StorageTuningKnob knobs = 1;
  repeated string applied = 2;
  repeated string rejected = 3;
  string message = 4;
}

// ==========================================
// Snapshots and Backups
// ==========================================

message StorageSnapshot {
  string id = 1;
  string node_id = 2;
  string pool = 3;
  // volume is the volume the snapshot belongs to; empty for pool-wide
  // (recursive) snapshots.
  string volume = 4;
  string name = 5;
  google.protobuf.Timestamp created_at = 6;
  int64 size_bytes = 7;
  int64 used_bytes = 8;
  string description = 9;
  // backend is "zfs", "lvmthin", "rbd" or "qcow2".
  string backend = 10;
  // parent names the previous snapshot in an incremental chain.
  string parent = 11;
  bool recursive = 12;
}

message ListStorageSnapshotsRequest {
  string node_id = 1;
  string pool = 2;
  string volume = 3;
}

message ListStorageSnapshotsResponse {
  repeated StorageSnapshot snapshots = 1;
}

message CreateStorageSnapshotRequest {
  string node_id = 1;
  string pool = 2;
  string volume = 3;
  // name is the snapshot's own name, without the pool prefix.
  string name = 4;
  string description = 5;
  // recursive snapshots the dataset and its children (ZFS only).
  bool recursive = 6;
  // quiesce freezes the guest filesystem through the guest agent first.
  bool quiesce = 7;
}

message CreateStorageSnapshotResponse {
  bool success = 1;
  string message = 2;
  StorageSnapshot snapshot = 3;
}

message DeleteStorageSnapshotRequest {
  string node_id = 1;
  string pool = 2;
  string volume = 3;
  string name = 4;
  // force deletes the snapshot and its dependent clones/snapshots.
  bool force = 5;
}

message DeleteStorageSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message RestoreStorageSnapshotRequest {
  string node_id = 1;
  string pool = 2;
  string volume = 3;
  string name = 4;
  // dry_run reports what the restore would do without doing it.
  bool dry_run = 5;
}

message RestoreStorageSnapshotResponse {
  bool success = 1;
  string message = 2;
  bool dry_run = 3;
  repeated string steps = 4;
  // blockers are reasons the restore cannot proceed, e.g. a running VM.
  repeated string blockers = 5;
}

message StorageSnapshotPolicy {
  string pool = 1;
  string volume = 2;
  // prefix goes in front of the timestamp in each snapshot name.
  string prefix = 3;
  // interval_minutes is how often a snapshot is taken; 0 disables the policy.
  int64 interval_minutes = 4;
  // retain is how many snapshots to keep; the oldest are pruned.
  int32 retain = 5;
  bool recursive = 6;
  // skip_if_busy skips a snapshot while a backup or maintenance runs.
  bool skip_if_busy = 7;
  bool enabled = 8;
}

// StorageBackup describes one backup run and where its data went.
message StorageBackup {
  string id = 1;
  string node_id = 2;
  string pool = 3;
  string volume = 4;
  // target is the backup destination, e.g. an NFS path or a restic repo.
  string target = 5;
  // kind is "full" or "incremental".
  string kind = 6;
  string state = 7;
  double progress_percent = 8;
  int64 bytes_transferred = 9;
  int64 bytes_total = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  string error = 13;
  string message = 14;
  // mechanism names the tool used: "zfs send", "rbd export-diff",
  // "qemu-img convert", "restic".
  string mechanism = 15;
}

message StartStorageBackupRequest {
  string node_id = 1;
  string pool = 2;
  string volume = 3;
  string snapshot = 4;
  string target = 5;
  bool incremental = 6;
  bool compress = 7;
  bool encrypt = 8;
  // quiesce freezes the guest filesystem first.
  bool quiesce = 9;
}

message StartStorageBackupResponse {
  StorageBackup backup = 1;
}

message ListStorageBackupsRequest {
  string node_id = 1;
  string pool = 2;
  int32 limit = 3;
}

message ListStorageBackupsResponse {
  repeated StorageBackup backups = 1;
}

message RestoreStorageBackupRequest {
  string node_id = 1;
  string backup_id = 2;
  string volume = 3;
  bool dry_run = 4;
}

message RestoreStorageBackupResponse {
  bool success = 1;
  string message = 2;
  bool dry_run = 3;
  repeated string blockers = 4;
}

message CancelStorageBackupRequest {
  string node_id = 1;
  string backup_id = 2;
}

message CancelStorageBackupResponse {
  StorageBackup backup = 1;
}

message ApplyRetentionRequest {
  string node_id = 1;
  string pool = 2;
  string volume = 3;
  string prefix = 4;
  int32 retain = 5;
  // dry_run lists what would be deleted.
  bool dry_run = 6;
}

message ApplyRetentionResponse {
  bool success = 1;
  string message = 2;
  repeated string deleted = 3;
  repeated string kept = 4;
}

// ==========================================
// Encryption and Key Management
// ==========================================

enum StorageEncryptionMode {
  STORAGE_ENCRYPTION_MODE_UNSPECIFIED = 0;
  STORAGE_ENCRYPTION_MODE_NONE = 1;
  STORAGE_ENCRYPTION_MODE_LUKS2 = 2;
  STORAGE_ENCRYPTION_MODE_ZFS_NATIVE = 3;
  STORAGE_ENCRYPTION_MODE_RBD = 4;
}

enum StorageKeyProvider {
  STORAGE_KEY_PROVIDER_UNSPECIFIED = 0;
  // The key lives in the kernel keyring, loaded at unlock.
  STORAGE_KEY_PROVIDER_KERNEL_KEYRING = 1;
  STORAGE_KEY_PROVIDER_TPM2 = 2;
  STORAGE_KEY_PROVIDER_PKCS11 = 3;
  STORAGE_KEY_PROVIDER_VAULT_KMIP = 4;
  // The operator supplies a passphrase at unlock; it is never stored.
  STORAGE_KEY_PROVIDER_PASSPHRASE = 5;
}

message StorageEncryption {
  string pool = 1;
  StorageEncryptionMode mode = 2;
  StorageKeyProvider provider = 3;
  // locked is true when the datastore is encrypted but its key is not
  // loaded, so its volumes cannot be opened.
  bool locked = 4;
  // key_id identifies the key version without revealing it.
  string key_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp rotated_at = 7;
  // supported lists the modes this host can use for this pool.
  repeated StorageEncryptionMode supported_modes = 8;
  // supported_providers lists the key providers available on this host.
  repeated StorageKeyProvider supported_providers = 9;
  string message = 10;
}

message GetStorageEncryptionRequest {
  string node_id = 1;
  string pool = 2;
}

message GetStorageEncryptionResponse {
  StorageEncryption encryption = 1;
}

message EnableStorageEncryptionRequest {
  string node_id = 1;
  string pool = 2;
  StorageEncryptionMode mode = 3;
  StorageKeyProvider provider = 4;
  // passphrase is used only when provider is PASSPHRASE; it is never stored
  // and never returned.
  string passphrase = 5;
}

message EnableStorageEncryptionResponse {
  bool success = 1;
  string message = 2;
  StorageEncryption encryption = 3;
}

message DisableStorageEncryptionRequest {
  string node_id = 1;
  string pool = 2;
  // passphrase unlocks the pool for the operation when it is locked.
  string passphrase = 3;
}

message DisableStorageEncryptionResponse {
  bool success = 1;
  string message = 2;
}

message StorageKeyRequest {
  string node_id = 1;
  string pool = 2;
  string passphrase = 3;
}

message StorageKeyResponse {
  bool success = 1;
  string message = 2;
  StorageEncryption encryption = 3;
}

// StorageKeyBackup is an opaque, already-encrypted key blob. The control
// plane stores it without being able to read it.
message StorageKeyBackup {
  string pool = 1;
  string key_id = 2;
  string wrapped_key = 3;
  google.protobuf.Timestamp created_at = 4;
}

message BackupStorageKeyRequest {
  string node_id = 1;
  string pool = 2;
  // passphrase wraps the exported key; empty uses the provider's own wrapping.
  string passphrase = 3;
}

message BackupStorageKeyResponse {
  bool success = 1;
  string message = 2;
  StorageKeyBackup backup = 3;
}

message VerifyStorageKeyRequest {
  string node_id = 1;
  string pool = 2;
  StorageKeyBackup backup = 3;
  string passphrase = 4;
}

message VerifyStorageKeyResponse {
  bool success = 1;
  string message = 2;
  string key_id = 3;
}

// ==========================================
// Pool Access Control and Events
// ==========================================

enum StorageAccessLevel {
  STORAGE_ACCESS_LEVEL_UNSPECIFIED = 0;
  STORAGE_ACCESS_LEVEL_READ = 1;
  STORAGE_ACCESS_LEVEL_WRITE = 2;
  STORAGE_ACCESS_LEVEL_ADMIN = 3;
}

enum StoragePrincipalKind {
  STORAGE_PRINCIPAL_KIND_UNSPECIFIED = 0;
  STORAGE_PRINCIPAL_KIND_USER = 1;
  STORAGE_PRINCIPAL_KIND_GROUP = 2;
  STORAGE_PRINCIPAL_KIND_HOST = 3;
  STORAGE_PRINCIPAL_KIND_APPLICATION = 4;
}

message StorageAccessRule {
  string id = 1;
  string pool = 2;
  StoragePrincipalKind principal_kind = 3;
  string principal = 4;
  StorageAccessLevel level = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool enabled = 7;
  string note = 8;
  // enforced_by says how the rule is enforced: "posix", "nfs-export",
  // "chap", "ceph-auth", "zfs-allow" or "control-plane" when the backend
  // cannot express it.
  string enforced_by = 9;
  google.protobuf.Timestamp created_at = 10;
  string created_by = 11;
}

message ListStorageAccessRulesRequest {
  string node_id = 1;
  string pool = 2;
}

message ListStorageAccessRulesResponse {
  repeated StorageAccessRule rules = 1;
}

message SetStorageAccessRuleRequest {
  string node_id = 1;
  StorageAccessRule rule = 2;
}

message SetStorageAccessRuleResponse {
  StorageAccessRule rule = 1;
}

message DeleteStorageAccessRuleRequest {
  string node_id = 1;
  string id = 2;
}

message DeleteStorageAccessRuleResponse {
  bool success = 1;
  string message = 2;
}

message StorageEvent {
  string id = 1;
  string node_id = 2;
  string pool = 3;
  // kind is "device", "raid", "zfs", "lvm", "smart", "audit" or "kernel".
  string kind = 4;
  // severity is "info", "warning", "error" or "critical".
  string severity = 5;
  string message = 6;
  // source names the collector: "udev", "mdadm", "zpool", "smartd",
  // "journald", "audit".
  string source = 7;
  google.protobuf.Timestamp at = 8;
  bool acknowledged = 9;
  string acknowledged_by = 10;
  google.protobuf.Timestamp acknowledged_at = 11;
  map<string, string> fields = 12;
}

message ListStorageEventsRequest {
  string node_id = 1;
  string pool = 2;
  // since is the oldest event to return; zero means the recent window.
  google.protobuf.Timestamp since = 3;
  repeated string kinds = 4;
  repeated string severities = 5;
  bool unacknowledged_only = 6;
  int32 limit = 7;
}

message ListStorageEventsResponse {
  repeated StorageEvent events = 1;
}

message AcknowledgeStorageEventsRequest {
  string node_id = 1;
  repeated string ids = 2;
  // acknowledge_all_older_than acknowledges everything before this time.
  google.protobuf.Timestamp acknowledge_all_older_than = 3;
}

message AcknowledgeStorageEventsResponse {
  int32 acknowledged = 1;
}

message ClearStorageEventsRequest {
  string node_id = 1;
  repeated string ids = 2;
  google.protobuf.Timestamp clear_all_older_than = 3;
}

message ClearStorageEventsResponse {
  int32 cleared = 1;
}

// ---------------- Service ----------------

service StorageProvisioningService {
  // Physical Devices & Disks
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RescanDevices(RescanDevicesRequest) returns (RescanDevicesResponse);
  rpc InitializeDisk(InitializeDiskRequest) returns (InitializeDiskResponse);
  rpc WipeDisk(WipeDiskRequest) returns (WipeDiskResponse);
  rpc GetDiskHealth(GetDiskHealthRequest) returns (GetDiskHealthResponse);

  // Partitions & Filesystems
  rpc CreatePartition(CreatePartitionRequest) returns (CreatePartitionResponse);
  rpc DeletePartition(DeletePartitionRequest) returns (DeletePartitionResponse);
  rpc FormatPartition(FormatPartitionRequest) returns (FormatPartitionResponse);
  rpc ResizePartition(ResizePartitionRequest) returns (ResizePartitionResponse);
  rpc MountFilesystem(MountFilesystemRequest) returns (MountFilesystemResponse);
  rpc UnmountFilesystem(UnmountFilesystemRequest) returns (UnmountFilesystemResponse);

  // LVM
  rpc ListLvm(ListLvmRequest) returns (ListLvmResponse);
  rpc CreateLvmPv(CreateLvmPvRequest) returns (CreateLvmPvResponse);
  rpc RemoveLvmPv(RemoveLvmPvRequest) returns (RemoveLvmPvResponse);
  rpc CreateLvmVg(CreateLvmVgRequest) returns (CreateLvmVgResponse);
  rpc RemoveLvmVg(RemoveLvmVgRequest) returns (RemoveLvmVgResponse);
  rpc CreateLvmLv(CreateLvmLvRequest) returns (CreateLvmLvResponse);
  rpc RemoveLvmLv(RemoveLvmLvRequest) returns (RemoveLvmLvResponse);
  rpc CreateLvmThinPool(CreateLvmThinPoolRequest) returns (CreateLvmThinPoolResponse);

  // ZFS
  rpc ListZfs(ListZfsRequest) returns (ListZfsResponse);
  rpc CreateZpool(CreateZpoolRequest) returns (CreateZpoolResponse);
  rpc DestroyZpool(DestroyZpoolRequest) returns (DestroyZpoolResponse);
  rpc CreateZfsDataset(CreateZfsDatasetRequest) returns (CreateZfsDatasetResponse);
  rpc DestroyZfsDataset(DestroyZfsDatasetRequest) returns (DestroyZfsDatasetResponse);
  rpc CreateZfsZvol(CreateZfsZvolRequest) returns (CreateZfsZvolResponse);

  // Storage Pools (Declarative Ceph RBD, ZFS, LVM, NFS, Dir)
  rpc ListStoragePools(ListStoragePoolsRequest) returns (ListStoragePoolsResponse);
  rpc GetStoragePool(GetStoragePoolRequest) returns (GetStoragePoolResponse);
  rpc CreateStoragePool(CreateStoragePoolRequest) returns (CreateStoragePoolResponse);
  rpc UpdateStoragePool(UpdateStoragePoolRequest) returns (UpdateStoragePoolResponse);
  rpc DeleteStoragePool(DeleteStoragePoolRequest) returns (DeleteStoragePoolResponse);

  // Volume Lifecycle on Storage Pools (Ceph RBD, ZFS, LVM, Directory)
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // Inheritable QoS & Live Throttling (QEMU iotune)
  rpc SetDiskQoS(SetDiskQoSRequest) returns (SetDiskQoSResponse);
  rpc GetDiskQoS(GetDiskQoSRequest) returns (GetDiskQoSResponse);

  // Software RAID (mdadm)
  rpc ListRaidSets(ListRaidSetsRequest) returns (ListRaidSetsResponse);
  rpc CreateRaidSet(CreateRaidSetRequest) returns (CreateRaidSetResponse);
  rpc AssembleRaidSet(AssembleRaidSetRequest) returns (AssembleRaidSetResponse);
  rpc GrowRaidSet(GrowRaidSetRequest) returns (GrowRaidSetResponse);
  rpc FailRaidMember(FailRaidMemberRequest) returns (FailRaidMemberResponse);
  rpc RemoveRaidMember(RemoveRaidMemberRequest) returns (RemoveRaidMemberResponse);
  rpc ReplaceRaidMember(ReplaceRaidMemberRequest) returns (ReplaceRaidMemberResponse);
  rpc DeleteRaidSet(DeleteRaidSetRequest) returns (DeleteRaidSetResponse);

  // Pool Performance Monitoring
  rpc GetStorageIo(GetStorageIoRequest) returns (GetStorageIoResponse);

  // Maintenance and Tuning
  rpc StartStorageMaintenance(StartStorageMaintenanceRequest) returns (StartStorageMaintenanceResponse);
  rpc ListStorageMaintenanceTasks(ListStorageMaintenanceTasksRequest) returns (ListStorageMaintenanceTasksResponse);
  rpc CancelStorageMaintenance(CancelStorageMaintenanceRequest) returns (CancelStorageMaintenanceResponse);
  rpc GetStorageTuning(GetStorageTuningRequest) returns (GetStorageTuningResponse);
  rpc SetStorageTuning(SetStorageTuningRequest) returns (SetStorageTuningResponse);

  // Snapshots and Backups
  rpc ListStorageSnapshots(ListStorageSnapshotsRequest) returns (ListStorageSnapshotsResponse);
  rpc CreateStorageSnapshot(CreateStorageSnapshotRequest) returns (CreateStorageSnapshotResponse);
  rpc DeleteStorageSnapshot(DeleteStorageSnapshotRequest) returns (DeleteStorageSnapshotResponse);
  rpc RestoreStorageSnapshot(RestoreStorageSnapshotRequest) returns (RestoreStorageSnapshotResponse);
  rpc StartStorageBackup(StartStorageBackupRequest) returns (StartStorageBackupResponse);
  rpc ListStorageBackups(ListStorageBackupsRequest) returns (ListStorageBackupsResponse);
  rpc RestoreStorageBackup(RestoreStorageBackupRequest) returns (RestoreStorageBackupResponse);
  rpc CancelStorageBackup(CancelStorageBackupRequest) returns (CancelStorageBackupResponse);
  rpc ApplyRetention(ApplyRetentionRequest) returns (ApplyRetentionResponse);

  // Encryption and Key Management
  rpc GetStorageEncryption(GetStorageEncryptionRequest) returns (GetStorageEncryptionResponse);
  rpc EnableStorageEncryption(EnableStorageEncryptionRequest) returns (EnableStorageEncryptionResponse);
  rpc DisableStorageEncryption(DisableStorageEncryptionRequest) returns (DisableStorageEncryptionResponse);
  rpc LockStoragePool(StorageKeyRequest) returns (StorageKeyResponse);
  rpc UnlockStoragePool(StorageKeyRequest) returns (StorageKeyResponse);
  rpc RotateStorageKey(StorageKeyRequest) returns (StorageKeyResponse);
  rpc BackupStorageKey(BackupStorageKeyRequest) returns (BackupStorageKeyResponse);
  rpc VerifyStorageKey(VerifyStorageKeyRequest) returns (VerifyStorageKeyResponse);

  // Pool Access Control and Events
  rpc ListStorageAccessRules(ListStorageAccessRulesRequest) returns (ListStorageAccessRulesResponse);
  rpc SetStorageAccessRule(SetStorageAccessRuleRequest) returns (SetStorageAccessRuleResponse);
  rpc DeleteStorageAccessRule(DeleteStorageAccessRuleRequest) returns (DeleteStorageAccessRuleResponse);
  rpc ListStorageEvents(ListStorageEventsRequest) returns (ListStorageEventsResponse);
  rpc AcknowledgeStorageEvents(AcknowledgeStorageEventsRequest) returns (AcknowledgeStorageEventsResponse);
  rpc ClearStorageEvents(ClearStorageEventsRequest) returns (ClearStorageEventsResponse);

  // Migration Pre-Flight Classifier (Zero-Disk-Copy vs Block Copy)
  rpc CheckMigrationStorage(CheckMigrationStorageRequest) returns (CheckMigrationStorageResponse);
}
