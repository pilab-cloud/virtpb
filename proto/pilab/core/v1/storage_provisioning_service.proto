syntax = "proto3";

package pilab.core.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/core/v1;corev1";

import "google/protobuf/timestamp.proto";

// ==========================================
// Storage Provisioning Service
// Manage physical disks, partition tables,
// LVM (PV/VG/LV), and ZFS (pools/datasets/zvols)
// ==========================================

enum PartitionTableType {
  PARTITION_TABLE_TYPE_UNSPECIFIED = 0;
  PARTITION_TABLE_TYPE_GPT = 1;
  PARTITION_TABLE_TYPE_MBR = 2;
}

enum PartitionType {
  PARTITION_TYPE_UNSPECIFIED = 0;
  PARTITION_TYPE_LINUX_FS = 1; // 8300 / ext4, xfs
  PARTITION_TYPE_LINUX_LVM = 2; // 8e00
  PARTITION_TYPE_LINUX_ZFS = 3; // bf00
  PARTITION_TYPE_LINUX_SWAP = 4; // 8200
}

enum FileSystemType {
  FILE_SYSTEM_TYPE_UNSPECIFIED = 0;
  FILE_SYSTEM_TYPE_EXT4 = 1;
  FILE_SYSTEM_TYPE_XFS = 2;
  FILE_SYSTEM_TYPE_SWAP = 3;
}

enum ZfsRaidType {
  ZFS_RAID_TYPE_UNSPECIFIED = 0;
  ZFS_RAID_TYPE_STRIPE = 1;
  ZFS_RAID_TYPE_MIRROR = 2;
  ZFS_RAID_TYPE_RAIDZ1 = 3;
  ZFS_RAID_TYPE_RAIDZ2 = 4;
  ZFS_RAID_TYPE_RAIDZ3 = 5;
}

// ---------------- Block Devices / Disks ----------------

message BlockDevice {
  string name = 1;              // e.g. "sda", "nvme0n1"
  string path = 2;              // e.g. "/dev/sda", "/dev/nvme0n1"
  int64 size_bytes = 3;
  string size_human = 4;        // e.g. "14.6T", "476.9G"
  string type = 5;              // "disk", "part", "loop", "lvm", "zfs"
  string fstype = 6;            // e.g. "ext4", "zfs_member", "LVM2_member"
  string label = 7;
  string uuid = 8;
  repeated string mountpoints = 9;
  string model = 10;
  string serial = 11;
  bool read_only = 12;
  string partition_table_type = 13; // "gpt", "dos", "unknown"
  bool is_system_disk = 14;     // true if carries root (/), /boot, or swap
  repeated BlockDevice children = 15;
  // Hardware / SAN identity used by the shared-LVM pre-flight.
  string scsi_wwid = 16;        // /dev/disk/by-id/scsi-<wwid>
  string multipath_path = 17;   // /dev/mapper/<name> when multipath is active
  string vendor = 18;
  string device_id = 19;
  string iscsi_session = 20;    // e.g. "session1" when the device is an iSCSI LUN
  string lvm_vg = 21;           // volume group when the device/LV belongs to one
}

message ListDevicesRequest {
  string node_id = 1;           // Optional: target node ID/hostname. Empty = aggregate all nodes
}

message ListDevicesResponse {
  string node_id = 1;
  string hostname = 2;
  repeated BlockDevice devices = 3;
}

message InitializeDiskRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda"
  PartitionTableType table_type = 3; // GPT or MBR
  bool wipe_existing = 4;       // run wipefs first
}

message InitializeDiskResponse {
  bool success = 1;
  string message = 2;
  string device = 3;
}

message WipeDiskRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda"
}

message WipeDiskResponse {
  bool success = 1;
  string message = 2;
}

message RescanDevicesRequest {
  string node_id = 1;
}

message RescanDevicesResponse {
  string node_id = 1;
  string hostname = 2;
  repeated BlockDevice devices = 3;
  string message = 4;
}

message DiskHealth {
  string device = 1;
  bool healthy = 2;
  // status is the SMART overall-health value, e.g. "PASSED", "FAILED",
  // "UNKNOWN" when smartctl is unavailable.
  string status = 3;
  int32 temperature_celsius = 4;
  int64 power_on_hours = 5;
  int64 reallocated_sectors = 6;
  int64 pending_sectors = 7;
  int64 wear_level_percent = 8;
  string model = 9;
  string serial = 10;
  string detail = 11;
}

message GetDiskHealthRequest {
  string node_id = 1;
  string device = 2;
}

message GetDiskHealthResponse {
  DiskHealth health = 1;
}

// ---------------- Partitions ----------------

message CreatePartitionRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda"
  PartitionType partition_type = 3;
  int64 size_mb = 4;            // 0 = allocate all remaining free space
  string name = 5;              // partition label/name
}

message CreatePartitionResponse {
  bool success = 1;
  string message = 2;
  string partition_device = 3;  // e.g. "/dev/sda1"
  uint32 partition_number = 4;
}

message DeletePartitionRequest {
  string node_id = 1;
  string device = 2;            // disk e.g. "/dev/sda" or partition "/dev/sda1"
  uint32 partition_number = 3;  // optional if partition device provided
}

message DeletePartitionResponse {
  bool success = 1;
  string message = 2;
}

message FormatPartitionRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda1"
  FileSystemType fs_type = 3;   // EXT4, XFS
  string label = 4;
}

message FormatPartitionResponse {
  bool success = 1;
  string message = 2;
}

message MountFilesystemRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda1" or "/dev/vg/lv"
  string mount_point = 3;       // absolute host path
  string fs_type = 4;           // optional; auto-detected when empty
  repeated string options = 5;  // mount options, e.g. ["noatime"]
  bool create_mountpoint = 6;
  // persist=true asks the agent to make the mount survive reboot.
  bool persist = 7;
}

message MountFilesystemResponse {
  bool success = 1;
  string message = 2;
  string mount_point = 3;
}

message UnmountFilesystemRequest {
  string node_id = 1;
  string mount_point = 2;
  bool force = 3;
}

message UnmountFilesystemResponse {
  bool success = 1;
  string message = 2;
}

message ResizePartitionRequest {
  string node_id = 1;
  string device = 2;            // disk e.g. "/dev/sda"
  uint32 partition_number = 3;
  // size_mb is the new partition size; 0 grows to the end of the disk.
  int64 size_mb = 4;
  // resize_filesystem grows ext4/xfs after the partition is resized.
  bool resize_filesystem = 5;
}

message ResizePartitionResponse {
  bool success = 1;
  string message = 2;
  string partition_device = 3;
  int64 size_bytes = 4;
}

// ---------------- LVM ----------------

message LvmPv {
  string name = 1;              // e.g. "/dev/sda2"
  string vg_name = 2;
  int64 size_bytes = 3;
  int64 free_bytes = 4;
}

message LvmVg {
  string name = 1;              // e.g. "vg_data"
  int64 size_bytes = 2;
  int64 free_bytes = 3;
  uint32 pv_count = 4;
  uint32 lv_count = 5;
}

message LvmLv {
  string name = 1;              // e.g. "lv_vms"
  string vg_name = 2;
  string path = 3;              // e.g. "/dev/vg_data/lv_vms"
  int64 size_bytes = 4;
  string pool_name = 5;
  bool is_thin = 6;
}

message ListLvmRequest {
  string node_id = 1;
}

message ListLvmResponse {
  string node_id = 1;
  repeated LvmPv pvs = 2;
  repeated LvmVg vgs = 3;
  repeated LvmLv lvs = 4;
}

message CreateLvmPvRequest {
  string node_id = 1;
  string device = 2;            // e.g. "/dev/sda2"
}

message CreateLvmPvResponse {
  bool success = 1;
  string message = 2;
}

message RemoveLvmPvRequest {
  string node_id = 1;
  string device = 2;
}

message RemoveLvmPvResponse {
  bool success = 1;
  string message = 2;
}

message CreateLvmVgRequest {
  string node_id = 1;
  string vg_name = 2;
  repeated string devices = 3;  // PV devices e.g. ["/dev/sda2"]
}

message CreateLvmVgResponse {
  bool success = 1;
  string message = 2;
}

message RemoveLvmVgRequest {
  string node_id = 1;
  string vg_name = 2;
}

message RemoveLvmVgResponse {
  bool success = 1;
  string message = 2;
}

message CreateLvmLvRequest {
  string node_id = 1;
  string vg_name = 2;
  string lv_name = 3;
  int64 size_mb = 4;
  bool is_thin = 5;
  string thin_pool_name = 6;
}

message CreateLvmLvResponse {
  bool success = 1;
  string message = 2;
  string lv_path = 3;
}

message RemoveLvmLvRequest {
  string node_id = 1;
  string vg_name = 2;
  string lv_name = 3;
}

message RemoveLvmLvResponse {
  bool success = 1;
  string message = 2;
}

message CreateLvmThinPoolRequest {
  string node_id = 1;
  string vg_name = 2;
  string pool_name = 3;
  int64 size_mb = 4;            // 0 uses all free extents in the VG
  int64 chunk_size_kb = 5;      // optional; e.g. 128
  int64 metadata_size_mb = 6;   // optional
}

message CreateLvmThinPoolResponse {
  bool success = 1;
  string message = 2;
  string pool_path = 3;         // e.g. "/dev/vg_fast/pool_vms"
}

// ---------------- ZFS ----------------

message ZfsPool {
  string name = 1;              // e.g. "tank", "bulk"
  string state = 2;             // ONLINE, DEGRADED, FAULTED
  int64 size_bytes = 3;
  int64 alloc_bytes = 4;
  int64 free_bytes = 5;
  string health = 6;
  string mountpoint = 7;
  repeated string vdevs = 8;
  string scan_status = 9;
}

message ZfsDataset {
  string name = 1;              // e.g. "tank/vms", "bulk/images"
  string pool = 2;
  string type = 3;              // "filesystem", "volume"
  string mountpoint = 4;
  int64 used_bytes = 5;
  int64 avail_bytes = 6;
  string compression = 7;
}

message ListZfsRequest {
  string node_id = 1;
}

message ListZfsResponse {
  string node_id = 1;
  repeated ZfsPool pools = 2;
  repeated ZfsDataset datasets = 3;
}

message CreateZpoolRequest {
  string node_id = 1;
  string pool_name = 2;
  ZfsRaidType raid_type = 3;    // STRIPE, MIRROR, RAIDZ1, RAIDZ2
  repeated string devices = 4;  // e.g. ["/dev/sdb1"] or ["/dev/sda", "/dev/sdb"]
  string mountpoint = 5;        // e.g. "/tank" or "none"
  uint32 ashift = 6;            // default 12 (4K sectors)
  map<string, string> properties = 7; // e.g. compression=zstd
}

message CreateZpoolResponse {
  bool success = 1;
  string message = 2;
}

message DestroyZpoolRequest {
  string node_id = 1;
  string pool_name = 2;
  bool force = 3;
}

message DestroyZpoolResponse {
  bool success = 1;
  string message = 2;
}

message CreateZfsDatasetRequest {
  string node_id = 1;
  string dataset_name = 2;      // e.g. "tank/vms"
  string mountpoint = 3;
  map<string, string> properties = 4; // e.g. compression=zstd
}

message CreateZfsDatasetResponse {
  bool success = 1;
  string message = 2;
}

message DestroyZfsDatasetRequest {
  string node_id = 1;
  string dataset_name = 2;
  bool recursive = 3;
}

message DestroyZfsDatasetResponse {
  bool success = 1;
  string message = 2;
}

message CreateZfsZvolRequest {
  string node_id = 1;
  string pool_name = 2;         // e.g. "tank"
  string zvol_name = 3;         // e.g. "vm-disk-100"
  int64 size_mb = 4;
  string blocksize = 5;         // default "64k"
  bool sparse = 6;              // thin-provisioned
}

message CreateZfsZvolResponse {
  bool success = 1;
  string message = 2;
  string zvol_device = 3;       // e.g. "/dev/zvol/tank/vm-disk-100"
}

// ---------------- Storage Pools & QoS Architecture ----------------

enum StoragePoolScope {
  STORAGE_POOL_SCOPE_UNSPECIFIED = 0;
  STORAGE_POOL_SCOPE_NODE_LOCAL = 1;     // Bound to a single hypervisor (local NVMe, SSD, local ZFS)
  STORAGE_POOL_SCOPE_CLUSTER_SHARED = 2;  // Accessible across all hypervisors (Ceph RBD, NFS, shared iSCSI)
}

enum StoragePoolDriver {
  STORAGE_POOL_DRIVER_UNSPECIFIED = 0;
  STORAGE_POOL_DRIVER_CEPH_RBD = 1;       // Native QEMU librbd
  STORAGE_POOL_DRIVER_DIR = 2;            // Filesystem directory (qcow2/raw)
  STORAGE_POOL_DRIVER_ZFS = 3;            // ZFS dataset or zvol
  STORAGE_POOL_DRIVER_LVM_THIN = 4;       // LVM Thin pool
  STORAGE_POOL_DRIVER_NFS = 5;            // NFSv4 mount
  STORAGE_POOL_DRIVER_ISCSI = 6;          // iSCSI target/LUN
}

// Inheritable Disk QoS Configuration
message DiskQoSConfig {
  // IOPS Limits (Mandatory default: 2500, burst: 5000)
  int64 total_iops = 1;
  int64 read_iops = 2;
  int64 write_iops = 3;
  int64 iops_burst = 4;
  int64 iops_burst_duration_sec = 5; // seconds

  // Bandwidth Limits in bytes/sec (Mandatory default: 157286400 = 150MB/s, burst: 314572800 = 300MB/s)
  int64 total_bytes_sec = 6;
  int64 read_bytes_sec = 7;
  int64 write_bytes_sec = 8;
  int64 bytes_burst = 9;

  // Cgroups v2 blkio weight (100 - 1000, default: 500)
  int32 io_weight = 10;
  
  // When true, tracks the backing StoragePool's default_qos dynamically
  bool inherit_from_pool = 11;
}

// Ceph RBD Backing Specification
message CephPoolBacking {
  repeated string monitors = 1;      // e.g. ["10.99.0.10:6789", "10.99.0.3:6789"]
  string pool_name = 2;              // e.g. "rbd-vms"
  string user = 3;                   // e.g. "pivirt" or "admin"
  string keyring_path = 4;           // e.g. "/etc/ceph/ceph.client.pivirt.keyring"
  string conf_path = 5;              // e.g. "/etc/ceph/ceph.conf"
}

// ZFS Pool Backing Specification
message ZfsPoolBacking {
  string zpool_name = 1;             // e.g. "tank"
  string dataset_name = 2;           // e.g. "tank/vms"
}

// LVM Thin Pool Backing Specification
message LvmPoolBacking {
  string vg_name = 1;                // e.g. "vg_fast"
  string thin_pool_name = 2;         // e.g. "pool_vms"
}

// NFS Pool Backing Specification
message NfsPoolBacking {
  string server = 1;                 // e.g. "10.99.0.100"
  string export_path = 2;            // e.g. "/srv/nfs/vms"
  string mount_options = 3;          // e.g. "rw,noatime,hard,intr,vers=4.2"
}

// Directory Pool Backing Specification
message DirPoolBacking {
  string path = 1;                   // e.g. "/var/lib/pivirt/storage"
}

// Full StoragePool representation
message StoragePoolDescriptor {
  string id = 1;
  string name = 2;
  StoragePoolScope scope = 3;
  StoragePoolDriver driver = 4;
  string mount_point = 5;            // Host mount point if applicable

  bool is_shared = 6;                // True if cluster-shared (e.g. Ceph RBD, NFS)
  bool thin_provisioning = 7;        // Supports thin allocation
  repeated string supported_formats = 8; // ["raw", "qcow2", "zvol"]

  DiskQoSConfig default_qos = 9;     // Default QoS inherited by all disks

  int64 total_bytes = 10;
  int64 available_bytes = 11;
  int64 allocated_bytes = 12;

  repeated string mounted_node_ids = 13; // Nodes currently connected / mounting

  oneof backing {
    CephPoolBacking ceph = 20;
    ZfsPoolBacking zfs = 21;
    LvmPoolBacking lvm = 22;
    NfsPoolBacking nfs = 23;
    DirPoolBacking dir = 24;
  }
}

// Storage Pool RPC Messages
message ListStoragePoolsRequest {
  string node_id = 1; // Optional: filter by node accessibility
}

message ListStoragePoolsResponse {
  repeated StoragePoolDescriptor pools = 1;
}

message GetStoragePoolRequest {
  string id_or_name = 1;
}

message GetStoragePoolResponse {
  StoragePoolDescriptor pool = 1;
}

message CreateStoragePoolRequest {
  StoragePoolDescriptor pool = 1;
}

message CreateStoragePoolResponse {
  bool success = 1;
  string message = 2;
  StoragePoolDescriptor pool = 3;
}

message UpdateStoragePoolRequest {
  StoragePoolDescriptor pool = 1;
}

message UpdateStoragePoolResponse {
  bool success = 1;
  string message = 2;
  StoragePoolDescriptor pool = 3;
}

message DeleteStoragePoolRequest {
  string id_or_name = 1;
  bool force = 2;
}

message DeleteStoragePoolResponse {
  bool success = 1;
  string message = 2;
}

// ---------------- Volume Lifecycle on Storage Pools ----------------

message StorageVolume {
  string id = 1;
  string name = 2;              // e.g. "vm-prod-100-disk0"
  string pool_name = 3;         // e.g. "ceph-shared" or "local-tank"
  string pool_id = 4;
  StoragePoolDriver driver = 5; // CEPH_RBD, ZFS, LVM_THIN, DIR
  string volume_path = 6;       // e.g. "rbd:rbd-vms/vm-prod-100-disk0" or "/dev/zvol/tank/vms/vm-100"
  int64 size_bytes = 7;
  string size_human = 8;
  string format = 9;            // "raw", "qcow2"
  bool is_shared = 10;
  DiskQoSConfig qos = 11;
  google.protobuf.Timestamp created_at = 12;
}

message CreateVolumeRequest {
  string node_id = 1;           // Target node if node-local pool, or empty for cluster-shared
  string pool_name = 2;         // e.g. "ceph-shared"
  string volume_name = 3;       // e.g. "vm-test-disk0"
  int64 size_mb = 4;
  string format = 5;            // "raw", "qcow2" (default: "raw" for Ceph, "qcow2" for Dir)
  DiskQoSConfig qos = 6;        // Optional QoS overrides; if nil/zero, inherits pool.default_qos
}

message CreateVolumeResponse {
  bool success = 1;
  string message = 2;
  StorageVolume volume = 3;
}

message DeleteVolumeRequest {
  string node_id = 1;
  string pool_name = 2;
  string volume_name = 3;
  bool force = 4;
}

message DeleteVolumeResponse {
  bool success = 1;
  string message = 2;
}

message ResizeVolumeRequest {
  string node_id = 1;
  string pool_name = 2;
  string volume_name = 3;
  int64 new_size_mb = 4;
}

message ResizeVolumeResponse {
  bool success = 1;
  string message = 2;
  StorageVolume volume = 3;
}

message ListVolumesRequest {
  string node_id = 1;
  string pool_name = 2;         // e.g. "ceph-shared"
}

message ListVolumesResponse {
  repeated StorageVolume volumes = 1;
}

// Live Dynamic Disk QoS Throttling RPC Messages
message SetDiskQoSRequest {
  string node_id = 1;
  string vm_id = 2;
  string device_or_drive_id = 3;     // e.g. "drive-virtio-disk0" or "vda"
  DiskQoSConfig qos = 4;
}

message SetDiskQoSResponse {
  bool success = 1;
  string message = 2;
  DiskQoSConfig applied_qos = 3;
}

message GetDiskQoSRequest {
  string node_id = 1;
  string vm_id = 2;
  string device_or_drive_id = 3;
}

message GetDiskQoSResponse {
  DiskQoSConfig qos = 1;
}

// Migration Storage Pre-flight Check
enum MigrationStorageMode {
  MIGRATION_STORAGE_MODE_UNSPECIFIED = 0;
  MIGRATION_STORAGE_MODE_SHARED_ZERO_COPY = 1; // All disks are on shared storage (Ceph/NFS); zero disk copy needed
  MIGRATION_STORAGE_MODE_STORAGE_COPY = 2;      // At least one disk is local; requires QEMU block mirroring
}

message NonSharedDiskInfo {
  string disk_id = 1;
  string device = 2;
  string path = 3;
  string storage_pool = 4;
  int64 size_bytes = 5;
  string reason = 6; // e.g. "Pool 'local-nvme' is NodeLocal to Hades"
}

message CheckMigrationStorageRequest {
  string vm_id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  repeated BlockDevice disks = 4; // Optional: specific disks to check if known by caller
}

message CheckMigrationStorageResponse {
  MigrationStorageMode mode = 1;
  bool can_zero_copy = 2;
  repeated NonSharedDiskInfo non_shared_disks = 3;
  string recommendation = 4;
}

// ---------------- Service ----------------

service StorageProvisioningService {
  // Physical Devices & Disks
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RescanDevices(RescanDevicesRequest) returns (RescanDevicesResponse);
  rpc InitializeDisk(InitializeDiskRequest) returns (InitializeDiskResponse);
  rpc WipeDisk(WipeDiskRequest) returns (WipeDiskResponse);
  rpc GetDiskHealth(GetDiskHealthRequest) returns (GetDiskHealthResponse);

  // Partitions & Filesystems
  rpc CreatePartition(CreatePartitionRequest) returns (CreatePartitionResponse);
  rpc DeletePartition(DeletePartitionRequest) returns (DeletePartitionResponse);
  rpc FormatPartition(FormatPartitionRequest) returns (FormatPartitionResponse);
  rpc ResizePartition(ResizePartitionRequest) returns (ResizePartitionResponse);
  rpc MountFilesystem(MountFilesystemRequest) returns (MountFilesystemResponse);
  rpc UnmountFilesystem(UnmountFilesystemRequest) returns (UnmountFilesystemResponse);

  // LVM
  rpc ListLvm(ListLvmRequest) returns (ListLvmResponse);
  rpc CreateLvmPv(CreateLvmPvRequest) returns (CreateLvmPvResponse);
  rpc RemoveLvmPv(RemoveLvmPvRequest) returns (RemoveLvmPvResponse);
  rpc CreateLvmVg(CreateLvmVgRequest) returns (CreateLvmVgResponse);
  rpc RemoveLvmVg(RemoveLvmVgRequest) returns (RemoveLvmVgResponse);
  rpc CreateLvmLv(CreateLvmLvRequest) returns (CreateLvmLvResponse);
  rpc RemoveLvmLv(RemoveLvmLvRequest) returns (RemoveLvmLvResponse);
  rpc CreateLvmThinPool(CreateLvmThinPoolRequest) returns (CreateLvmThinPoolResponse);

  // ZFS
  rpc ListZfs(ListZfsRequest) returns (ListZfsResponse);
  rpc CreateZpool(CreateZpoolRequest) returns (CreateZpoolResponse);
  rpc DestroyZpool(DestroyZpoolRequest) returns (DestroyZpoolResponse);
  rpc CreateZfsDataset(CreateZfsDatasetRequest) returns (CreateZfsDatasetResponse);
  rpc DestroyZfsDataset(DestroyZfsDatasetRequest) returns (DestroyZfsDatasetResponse);
  rpc CreateZfsZvol(CreateZfsZvolRequest) returns (CreateZfsZvolResponse);

  // Storage Pools (Declarative Ceph RBD, ZFS, LVM, NFS, Dir)
  rpc ListStoragePools(ListStoragePoolsRequest) returns (ListStoragePoolsResponse);
  rpc GetStoragePool(GetStoragePoolRequest) returns (GetStoragePoolResponse);
  rpc CreateStoragePool(CreateStoragePoolRequest) returns (CreateStoragePoolResponse);
  rpc UpdateStoragePool(UpdateStoragePoolRequest) returns (UpdateStoragePoolResponse);
  rpc DeleteStoragePool(DeleteStoragePoolRequest) returns (DeleteStoragePoolResponse);

  // Volume Lifecycle on Storage Pools (Ceph RBD, ZFS, LVM, Directory)
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // Inheritable QoS & Live Throttling (QEMU iotune)
  rpc SetDiskQoS(SetDiskQoSRequest) returns (SetDiskQoSResponse);
  rpc GetDiskQoS(GetDiskQoSRequest) returns (GetDiskQoSResponse);

  // Migration Pre-Flight Classifier (Zero-Disk-Copy vs Block Copy)
  rpc CheckMigrationStorage(CheckMigrationStorageRequest) returns (CheckMigrationStorageResponse);
}
