syntax = "proto3";

package pilab.cloud.core.v1;

option go_package = "go.pilab.hu/cloud/virtpb/v3/pilab/core/v1;corev1";

service RbacService {
  rpc ListPrivileges(ListPrivilegesRequest) returns (ListPrivilegesResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // Hierarchical permission binding (Principal + Role on Entity with Propagation)
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  rpc AssignPermission(AssignPermissionRequest) returns (AssignPermissionResponse);
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse);
  
  // Resolve effective permissions for the current caller on an entity
  rpc GetEffectivePrivileges(GetEffectivePrivilegesRequest) returns (GetEffectivePrivilegesResponse);
}

message Privilege {
  string id = 1;           // e.g. "VirtualMachine.Interact.PowerOn"
  string category = 2;     // "VirtualMachine", "Datastore", "Network", "Host"
  string description = 3;
}

message Role {
  string id = 1;           // "role-admin", "role-vm-user", "role-readonly"
  string name = 2;
  string description = 3;
  bool is_system_role = 4;
  repeated string privilege_ids = 5;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ROOT = 1;
  DATACENTER = 2;
  CLUSTER = 3;
  HOST = 4;
  RESOURCE_POOL = 5;
  VIRTUAL_MACHINE = 6;
  DATASTORE = 7;
  DISTRIBUTED_SWITCH = 8;
}

message Permission {
  string id = 1;
  string principal_id = 2; // User ID or Group ID
  bool is_group = 3;
  string role_id = 4;
  string entity_id = 5;    // Target Inventory Entity UUID
  EntityType entity_type = 6;
  bool propagate = 7;      // If true, applies down to all children entities
}

message AssignPermissionRequest {
  string principal_id = 1;
  bool is_group = 2;
  string role_id = 3;
  string entity_id = 4;
  EntityType entity_type = 5;
  bool propagate = 6;
}

message AssignPermissionResponse {
  Permission permission = 1;
}

message RevokePermissionRequest {
  string permission_id = 1;
}

message RevokePermissionResponse {}

message GetEffectivePrivilegesRequest {
  string entity_id = 1;
}

message GetEffectivePrivilegesResponse {
  repeated string privilege_ids = 1;
}

message ListPrivilegesRequest {}
message ListPrivilegesResponse { repeated Privilege privileges = 1; }
message ListRolesRequest {}
message ListRolesResponse { repeated Role roles = 1; }
message CreateRoleRequest { string name = 1; string description = 2; repeated string privilege_ids = 3; }
message CreateRoleResponse { Role role = 1; }
message UpdateRoleRequest { string role_id = 1; string name = 2; string description = 3; repeated string privilege_ids = 4; }
message UpdateRoleResponse { Role role = 1; }
message DeleteRoleRequest { string role_id = 1; }
message DeleteRoleResponse {}
message ListPermissionsRequest { string entity_id = 1; }
message ListPermissionsResponse { repeated Permission permissions = 1; }
